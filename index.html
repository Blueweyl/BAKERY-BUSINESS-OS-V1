<script>
/* ============================================================
   Actions — every button in the app resolves to one of these.
   ============================================================ */
const removeById = (list, id) => { const i = list.findIndex(x => x.id === id); if (i > -1) list.splice(i, 1); };

const ACTIONS = {
  go: d => go(d.view),
  closeModal: () => closeModal(),
  closeModalBack: () => closeModal(),
  confirmYes: () => { const fn = pendingConfirm; pendingConfirm = null; closeModal(); if (fn) fn(); },

  /* ---- orders ---- */
  addOrder(d, el) {
    const f = readForm(el);
    if (!f.customerId) return toast("Pick a customer first.");
    if (!f.productId) return toast("Pick a product first.");
    const p = productById(f.productId);
    const qty = Math.max(1, parseInt(f.qty, 10) || 1);
    const total = f.total !== "" ? num(f.total) : (p ? costing(p).price * qty : 0);
    commit(() => db.orders.push({
      id: uid(), customerId: f.customerId, productId: f.productId, qty,
      date: f.date || todayISO(), status: "enquiry", total: round2(total),
      depositRequired: 0, payments: [], costSnapshot: null,
      notes: "", createdAt: todayISO()
    }), "Enquiry added.");
    clearForm(el);
  },
  openOrder: d => openOrderModal(d.id),
  saveOrder(d, el) {
    if (!applyOrderForm(d.id, readForm(el), "Order updated.")) return;
    closeModal();
  },
  /** Records cash typed into the dialog, keeping any other edits. */
  addPayment(d, el) {
    const f = readForm(el);
    const amount = round2(f.payAmount);
    if (!(amount > 0)) return toast("Enter an amount to record.");
    const o = byId(db.orders, d.id);
    const record = () => {
      applyOrderForm(d.id, f, null, ord => addPayment(ord, amount, f.payDate || todayISO(), ""));
      openOrderModal(d.id);
      toast("Payment of " + money(amount) + " recorded.");
    };
    // More than the balance is usually the same payment entered twice.
    const over = round2(amount - balanceOf(o));
    if (over > 0.005) {
      return confirmDo("That is more than is owed", "The balance on this order is " + money(balanceOf(o)) +
        ", so recording " + money(amount) + " leaves it overpaid by " + money(over) +
        ". Check it is not a payment you have already entered.",
        "Record anyway", record);
    }
    record();
  },
  payDeposit(d, el) {
    const f = readForm(el);
    applyOrderForm(d.id, f, null, o => addPayment(o, depositDue(o), todayISO(), "Deposit"));
    openOrderModal(d.id);
    toast("Deposit recorded.");
  },
  deletePayment(d, el) {
    const f = readForm(el);
    applyOrderForm(d.id, f, null, o => {
      o.payments = paymentsOf(o).filter(pay => pay.id !== d.pay);
      if (o.status === "paid" && !isFullyPaid(o)) o.status = "booked";
    });
    openOrderModal(d.id);
    toast("Payment removed.");
  },
  advance(d) {
    commit(() => {
      const o = byId(db.orders, d.id);
      if (!o) return;
      const next = STATUSES[Math.min(STATUSES.length - 1, STATUSES.indexOf(o.status) + 1)];
      setStatus(o, next);
    });
  },
  markPaid(d, el) {
    const inDialog = !!(el && el.closest("[data-form='editOrder']"));
    if (inDialog) {
      applyOrderForm(d.id, readForm(el), null, o => addPayment(o, balanceOf(o), todayISO(), "Balance"));
      openOrderModal(d.id);
      return toast("Balance recorded.");
    }
    commit(() => { const o = byId(db.orders, d.id); if (o) setStatus(o, "paid"); }, "Balance recorded — order paid.");
  },
  deleteOrder(d) {
    const o = byId(db.orders, d.id);
    if (!o) return;
    const got = receivedOf(o);
    confirmDo("Delete order?", customerName(o.customerId) + " — " + productName(o.productId) +
      (got > 0 ? ". This also deletes " + money(got) + " of recorded payments, which will drop out of your cash received and profit figures." : ".") +
      " This cannot be undone.",
      "Delete order", () => commit(() => removeById(db.orders, d.id), "Order deleted."));
  },
  filterOrders(d) { ui.filter = d.value; render(); },
  showAllOrders() { ui.showAllOrders = true; render(); },
  showFewerOrders() { ui.showAllOrders = false; render(); },
  searchOrders(d, el) {
    ui.q = el.value;
    render();
    const box = $('#app input[data-change="searchOrders"]');
    if (box) { box.focus(); box.setSelectionRange(box.value.length, box.value.length); }
  },

  /* ---- customers ---- */
  addCustomer(d, el) {
    const f = readForm(el);
    if (!f.name || !f.name.trim()) return toast("A name is needed.");
    if (sameName(db.customers, f.name)) return toast("You already have a customer called " + f.name.trim() + ".");
    commit(() => db.customers.push({ id: uid(), name: f.name.trim(), email: f.email || "", phone: f.phone || "", notes: "", archived: false }), "Customer added.");
    clearForm(el);
  },
  toggleCustomer(d) { ui.openCustomer = ui.openCustomer === d.id ? null : d.id; render(); },
  editCustomer: d => openCustomerModal(d.id),
  saveCustomer(d, el) {
    const f = readForm(el);
    if (f.name && sameName(db.customers, f.name, d.id)) return toast("Another customer already has that name.");
    commit(() => { const c = customerById(d.id); if (c) Object.assign(c, { name: f.name || c.name, email: f.email, phone: f.phone, notes: f.notes }); }, "Customer saved.");
    closeModal();
  },
  /** A customer attached to orders is archived, so the sales they account
      for stay in the books. Only a customer with no history is deleted. */
  deleteCustomer(d) {
    const c = customerById(d.id);
    if (!c) return;
    const n = db.orders.filter(o => o.customerId === d.id).length;
    if (!n) {
      return confirmDo("Delete customer?", c.name + " has no orders.", "Delete",
        () => commit(() => removeById(db.customers, d.id), "Customer deleted."));
    }
    confirmDo("Archive " + c.name + "?", "They have " + n + " order" + (n === 1 ? "" : "s") +
      " in your records, so deleting them would change your sales history. Archiving hides them from new orders and keeps the history intact.",
      "Archive customer", () => commit(() => { c.archived = true; }, "Customer archived."));
  },
  restoreCustomer(d) { commit(() => { const c = customerById(d.id); if (c) c.archived = false; }, "Customer restored."); },

  /* ---- products ---- */
  addProduct(d, el) {
    const f = readForm(el);
    if (!f.name || !f.name.trim()) return toast("Give the product a name.");
    if (sameName(db.products, f.name)) return toast("You already have a product called " + f.name.trim() + ".");
    commit(() => db.products.push({
      id: uid(), name: f.name.trim(), category: f.category || "",
      ingCost: num(f.ingCost), labour: num(f.labour), overhead: num(f.overhead),
      margin: clamp(num(f.margin) || num(db.settings.defaultMargin), 0, 95),
      allergens: f.allergens || [], recipe: [], archived: false
    }), "Product added.");
    clearForm(el);
  },
  editProduct: d => openProductModal(d.id),
  /** Re-opens the dialog with what's typed so far, plus one more row. */
  addRecipeLine(d, el) {
    const draft = readForm(el);
    draft.recipe = readRecipe(el).concat([{ ingredientId: (db.ingredients[0] || {}).id || "", qty: 0 }]);
    if (!db.ingredients.length) return toast("Add an ingredient in Inventory first.");
    openProductModal(currentProductId, draft);
  },
  removeRecipeLine(d, el) {
    const draft = readForm(el);
    const lines = readRecipeRaw(el);
    lines.splice(parseInt(d.index, 10), 1);
    draft.recipe = lines;
    openProductModal(currentProductId, draft);
  },
  saveProduct(d, el) {
    const f = readForm(el);
    if (f.name && sameName(db.products, f.name, d.id)) return toast("Another product already has that name.");
    const recipe = readRecipe(el);
    commit(() => {
      const p = productById(d.id);
      if (p) Object.assign(p, {
        name: f.name || p.name, category: f.category, recipe,
        ingCost: recipe.length ? num(p.ingCost) : num(f.ingCost),
        labour: num(f.labour), overhead: num(f.overhead),
        margin: clamp(num(f.margin), 0, 95), allergens: f.allergens || []
      });
    }, "Product saved.");
    closeModal();
  },
  /** A product that has been sold is archived, so past orders keep their
      name, recipe and committed cost. */
  deleteProduct(d) {
    const p = productById(d.id);
    if (!p) return;
    const n = db.orders.filter(o => o.productId === d.id).length;
    const bakes = db.bakes.filter(b => b.productId === d.id).length;
    if (!n && !bakes) {
      return confirmDo("Delete product?", p.name + " has never been ordered or baked.", "Delete",
        () => commit(() => removeById(db.products, d.id), "Product deleted."));
    }
    confirmDo("Archive " + p.name + "?", "It appears on " + n + " order" + (n === 1 ? "" : "s") +
      (bakes ? " and " + bakes + " bake" + (bakes === 1 ? "" : "s") : "") +
      ". Archiving hides it from new orders and keeps that history readable.",
      "Archive product", () => commit(() => { p.archived = true; }, "Product archived."));
  },
  restoreProduct(d) { commit(() => { const p = productById(d.id); if (p) p.archived = false; }, "Product restored."); },

  /* ---- inventory ---- */
  addIngredient(d, el) {
    const f = readForm(el);
    if (!f.name || !f.name.trim()) return toast("Name the ingredient.");
    if (sameName(db.ingredients, f.name)) return toast("You already track an ingredient called " + f.name.trim() + ".");
    commit(() => db.ingredients.push({
      id: uid(), name: f.name.trim(), unit: f.unit || "kg",
      stock: round2(Math.max(0, num(f.stock))), reorder: round2(Math.max(0, num(f.reorder))),
      cost: round2(Math.max(0, num(f.cost))), expiry: f.expiry || ""
    }), "Ingredient added.");
    clearForm(el);
  },
  adjustStock(d) {
    commit(() => {
      const i = byId(db.ingredients, d.id);
      if (!i) return;
      const step = ["g", "ml", "units"].includes(i.unit) ? 1 : 0.5;
      i.stock = Math.max(0, +(num(i.stock) + num(d.by) * step).toFixed(2));
    });
  },
  deleteIngredient(d) {
    const i = byId(db.ingredients, d.id);
    if (!i) return;
    const users = db.products.filter(p => (p.recipe || []).some(l => l.ingredientId === d.id));
    if (!users.length) {
      return confirmDo("Delete ingredient?", i.name + " is not used in any recipe.", "Delete",
        () => commit(() => removeById(db.ingredients, d.id), "Ingredient removed."));
    }
    // Removing it would silently change what those products cost, so say so
    // and make the consequence the explicit choice.
    pendingConfirm = () => commit(() => {
      for (const p of users) {
        p.recipe = (p.recipe || []).filter(l => l.ingredientId !== d.id);
        if (!p.recipe.length) p.ingCost = round2(p.ingCost);
      }
      removeById(db.ingredients, d.id);
    }, "Removed from " + users.length + " recipe" + (users.length === 1 ? "" : "s") + " and deleted.");
    modal("Ingredient is in use", i.name + " is used by " + users.length + " recipe" + (users.length === 1 ? "" : "s") + ".",
      '<div class="stack" style="gap:8px">' +
        users.map(p => '<div class="row between" style="padding:6px 0;border-bottom:1px solid var(--line)">' +
          '<span>' + esc(p.name) + '</span><span class="hint">' + money(costing(p).cost) + ' per unit today</span></div>').join("") +
        '<p class="hint" style="margin:10px 0 0">Deleting it removes the ingredient from those recipes, which changes what they cost from now on. ' +
        'Orders already booked or paid keep the cost they were committed at.</p>' +
      '</div>',
      [{ label: "Cancel", act: "closeModal" },
       { label: "Remove from recipes and delete", act: "confirmYes", cls: "danger" }]);
  },

  /* ---- expenses ---- */
  addExpense(d, el) {
    const f = readForm(el);
    if (!f.category || !f.category.trim()) return toast("Give the expense a category.");
    const amount = round2(Math.max(0, num(f.amount)));
    if (!(amount > 0)) return toast("Enter an amount for the expense.");
    commit(() => db.expenses.push({ id: uid(), category: f.category.trim(), amount, date: f.date || todayISO(), notes: "" }), "Expense logged.");
    clearForm(el);
  },
  deleteExpense(d) { commit(() => removeById(db.expenses, d.id), "Expense deleted."); },

  /* ---- kitchen ---- */
  addTask(d, el) {
    const f = readForm(el);
    if (!f.text || !f.text.trim()) return toast("What's the task?");
    commit(() => db.tasks.push({ id: uid(), text: f.text.trim(), done: false, due: f.due || "" }));
    clearForm(el);
  },
  toggleTask(d) { commit(() => { const t = byId(db.tasks, d.id); if (t) t.done = !t.done; }); },
  deleteTask(d) { commit(() => removeById(db.tasks, d.id)); },
  addBake(d, el) {
    const f = readForm(el);
    if (!f.productId) return toast("Pick a product to log.");
    const p = productById(f.productId);
    const batches = Math.max(1, parseInt(f.qty, 10) || 1);
    const lines = recipeLines(p);
    const short = lines.filter(r => num(r.ingredient.stock) < r.qty * batches);
    const doLog = () => {
      commit(() => {
        // Record what was actually taken, not what the recipe asked for, so
        // deleting the bake can put back exactly that and nothing else.
        const deductions = lines.map(r => {
          const want = round2(r.qty * batches);
          const took = round2(Math.min(want, Math.max(0, num(r.ingredient.stock))));
          r.ingredient.stock = round2(num(r.ingredient.stock) - took);
          return { ingredientId: r.ingredient.id, qty: took };
        }).filter(x => x.qty > 0);
        db.bakes.push({ id: uid(), productId: f.productId, qty: batches, date: todayISO(), notes: "", deductions });
      }, lines.length ? "Bake logged — " + lines.length + " ingredients deducted." : "Bake logged.");
      clearForm(el);
    };
    if (short.length) {
      return confirmDo("Not enough stock", short.map(r =>
        r.ingredient.name + ": need " + +(r.qty * batches).toFixed(2) + " " + r.ingredient.unit +
        ", have " + num(r.ingredient.stock)).join(" · ") + ". Log the bake anyway and take stock to zero?",
        "Log anyway", doLog);
    }
    doLog();
  },
  deleteBake(d) {
    const b = byId(db.bakes, d.id);
    if (!b) return;
    const back = (b.deductions || []).filter(x => byId(db.ingredients, x.ingredientId));
    const restore = () => commit(() => {
      for (const x of back) {
        const i = byId(db.ingredients, x.ingredientId);
        if (i) i.stock = round2(num(i.stock) + num(x.qty));
      }
      removeById(db.bakes, d.id);
    }, back.length ? "Bake removed — stock put back." : "Bake removed.");
    if (!back.length) return restore();
    confirmDo("Remove this bake?", "Deleting it returns " + back.map(x =>
      num(x.qty) + " " + byId(db.ingredients, x.ingredientId).unit + " of " +
      byId(db.ingredients, x.ingredientId).name).join(", ") + " to inventory.", "Remove and restore stock", restore);
  },
  addWaste(d, el) {
    const f = readForm(el);
    if (!f.item || !f.item.trim()) return toast("What was wasted?");
    commit(() => db.waste.push({ id: uid(), item: f.item.trim(), qty: f.qty || "", reason: f.reason || "",
      cost: round2(Math.max(0, num(f.cost))), date: todayISO() }), "Waste logged.");
    clearForm(el);
  },
  deleteWaste(d) { commit(() => removeById(db.waste, d.id)); },
  addSocial(d, el) {
    const f = readForm(el);
    if (!f.caption || !f.caption.trim()) return toast("Add a caption idea.");
    commit(() => db.social.push({ id: uid(), caption: f.caption.trim(), channel: f.channel || "Instagram", date: f.date || todayISO(), done: false }), "Post planned.");
    clearForm(el);
  },
  toggleSocial(d) { commit(() => { const s = byId(db.social, d.id); if (s) s.done = !s.done; }); },
  deleteSocial(d) { commit(() => removeById(db.social, d.id)); },

  /* ---- calendar ---- */
  calMove(d) {
    const base = ui.month ? parseISO(ui.month + "-01") : (() => { const x = new Date(); x.setDate(1); return x; })();
    base.setMonth(base.getMonth() + parseInt(d.by, 10));
    ui.month = iso(base).slice(0, 7);
    render();
  },
  calToday() { ui.month = null; render(); },

  /* ---- printing ---- */
  printQuote: d => printDocs(orderDoc(byId(db.orders, d.id), "quote")),
  printInvoice: d => printDocs(orderDoc(byId(db.orders, d.id), "invoice")),
  printBakeSheet: () => printDocs(bakeSheetDoc(todayISO())),
  printBakeSheetFor(d, el) { const f = readForm(el); printDocs(bakeSheetDoc(f.date || todayISO())); },
  printShoppingList: () => printDocs(shoppingListDoc()),
  printLabels(d, el) { const f = readForm(el); printDocs(labelsDoc(f.productId, f.weight, f.copies)); },
  printPL: () => printDocs(plDoc()),

  /* ---- settings, exports, backup ---- */
  saveSettings(d, el) {
    const f = readForm(el);
    commit(() => Object.assign(db.settings, {
      bakeryName: f.bakeryName || "My Bakery", ownerName: f.ownerName, email: f.email, phone: f.phone,
      address: f.address, currency: f.currency || "$", terms: f.terms,
      monthlyGoal: num(f.monthlyGoal), defaultMargin: clamp(num(f.defaultMargin), 0, 95),
      depositPct: clamp(num(f.depositPct), 0, 100), quoteValidDays: Math.max(1, num(f.quoteValidDays))
    }), "Settings saved.");
  },
  downloadRescue: () => downloadRescue(),
  exportBackup() {
    db.meta.lastBackup = todayISO();
    save();
    download(slug(db.settings.bakeryName) + "-backup-" + stamp() + ".json", JSON.stringify(db, null, 2), "application/json");
    toast("Backup downloaded.");
    render();
  },
  importBackup(d, el) {
    const file = el.files && el.files[0];
    el.value = "";
    if (!file) return;
    if (file.size > 40 * 1024 * 1024) return toast("That file is too large to be a backup.");
    const reader = new FileReader();
    reader.onerror = () => toast("That file could not be read.");
    reader.onload = () => {
      let parsed;
      try { parsed = JSON.parse(reader.result); }
      catch (err) { return toast("That file isn't valid JSON — it may be damaged."); }
      const problems = backupProblems(parsed);
      if (problems.length) {
        return modal("This backup can't be restored", problems[0],
          problems.length > 1 ? '<ul class="muted" style="margin:0;padding-left:18px">' +
            problems.slice(1).map(x => '<li>' + esc(x) + '</li>').join("") + '</ul>' : "",
          [{ label: "Close", act: "closeModal" }]);
      }
      // Snapshot what is here now, so a restore can be undone if it was a mistake.
      const before = JSON.stringify(db);
      const counts = LISTS.map(k => (parsed[k] || []).length);
      confirmDo("Restore this backup?", "It replaces everything on this device with " +
        (parsed.orders || []).length + " orders, " + (parsed.customers || []).length + " customers, " +
        (parsed.products || []).length + " products and " + (parsed.ingredients || []).length + " ingredients" +
        (num(parsed.schema) < SCHEMA ? ", upgrading it from an earlier version of the app." : "."),
        "Restore", () => {
          undoSnapshot = before;
          db = migrate(parsed);
          writeNow();
          go("dashboard");
          toast("Backup restored — " + sum(counts) + " records.");
        });
    };
    reader.readAsText(file);
  },
  undoRestore() {
    if (!undoSnapshot) return;
    confirmDo("Undo?", "This puts back the data that was on this device before the last restore or reset.",
      "Undo restore", () => {
        db = migrate(JSON.parse(undoSnapshot));
        undoSnapshot = null;
        writeNow();
        go("dashboard");
        toast("Previous data put back.");
      });
  },
  exportWorkbook() {
    download(slug(db.settings.bakeryName) + "-workbook-" + stamp() + ".xls", toWorkbook(), "application/vnd.ms-excel");
    toast("Workbook downloaded — " + sheets().length + " sheets.");
  },
  exportCsv(d) {
    const found = sheets().find(s => slug(s[0]) === d.table);
    if (!found) return;
    download(slug(db.settings.bakeryName) + "-" + d.table + "-" + stamp() + ".csv", toCsv(found[1], found[2]), "text/csv");
  },
  resetEmpty() {
    confirmDo("Clear all data?", "Every order, customer, product and record on this device will be deleted. Export a backup first if you want to keep it.",
      "Delete everything", () => {
        undoSnapshot = JSON.stringify(db);
        const fresh = seed();
        db = Object.assign(fresh, {
          customers: [], products: [], ingredients: [], orders: [], expenses: [],
          tasks: [], bakes: [], waste: [], social: [],
          settings: Object.assign(fresh.settings, { bakeryName: db.settings.bakeryName, currency: db.settings.currency }),
          meta: { lastBackup: null, createdAt: todayISO(), sample: false }
        });
        writeNow(); go("dashboard"); toast("Cleared — use Undo in Backup & restore if that was a mistake.");
      });
  },
  resetSample() {
    confirmDo("Reload sample data?", "This replaces what's on the device with the demo bakery.",
      "Reload sample", () => { undoSnapshot = JSON.stringify(db); db = seed(); writeNow(); go("dashboard"); toast("Sample data loaded."); });
  }
};

/** Writes the order dialog's fields back, then runs an optional extra
    change (recording a payment, say) inside the same commit — so a side
    action can never discard what the user had already typed. */
function applyOrderForm(id, f, message, extra) {
  const o = byId(db.orders, id);
  if (!o) return false;
  const total = Math.max(0, num(f.total));
  commit(() => {
    if (f.customerId) o.customerId = f.customerId;
    if (f.productId && f.productId !== o.productId) {
      o.productId = f.productId;
      o.costSnapshot = null;            // the old freeze belongs to another product
    }
    o.qty = Math.max(1, parseInt(f.qty, 10) || 1);
    o.date = f.date || o.date;
    o.total = total;
    o.depositRequired = clamp(num(f.depositRequired), 0, total);
    o.notes = f.notes || "";
    if (f.status && f.status !== o.status) setStatus(o, f.status);
    if (isCommitted(o) && !o.costSnapshot) {
      const prod = productById(o.productId);
      if (prod) o.costSnapshot = snapshotCost(prod);
    }
    if (extra) extra(o);
    // A status can be typed in that the payments contradict; trust the cash.
    if (o.status === "paid" && !isFullyPaid(o)) o.status = "booked";
    if (o.status === "booked" && isFullyPaid(o) && num(o.total) > 0) o.status = "paid";
  }, message);
  return true;
}

/** Moves an order between stages. Stages never invent or destroy cash:
    committing an order freezes its cost and asks for a deposit, and moving
    backwards leaves every recorded payment exactly where it was. */
function setStatus(o, status) {
  o.status = status;
  if (isCommitted(o) && !o.costSnapshot) {
    const p = productById(o.productId);
    if (p) o.costSnapshot = snapshotCost(p);
  }
  if ((status === "quoted" || status === "booked") && !num(o.depositRequired)) {
    o.depositRequired = round2(num(o.total) * num(db.settings.depositPct) / 100);
  }
  // "Paid" is a statement that the money arrived, so record the balance.
  if (status === "paid" && !isFullyPaid(o)) addPayment(o, balanceOf(o), todayISO(), "Balance");
}

/* ---------- kanban drag & drop ---------- */
let dragId = null;
document.addEventListener("dragstart", e => {
  const card = e.target.closest(".kan-card");
  if (!card) return;
  dragId = card.dataset.id;
  e.dataTransfer.effectAllowed = "move";
  try { e.dataTransfer.setData("text/plain", dragId); } catch (err) { /* older browsers */ }
});
document.addEventListener("dragover", e => {
  const col = e.target.closest("[data-drop]");
  if (!col || !dragId) return;
  e.preventDefault();
  document.querySelectorAll(".kan-col.drag-over").forEach(c => c.classList.remove("drag-over"));
  col.classList.add("drag-over");
});
document.addEventListener("drop", e => {
  const col = e.target.closest("[data-drop]");
  if (!col || !dragId) return;
  e.preventDefault();
  const id = dragId; dragId = null;
  commit(() => { const o = byId(db.orders, id); if (o && o.status !== col.dataset.drop) setStatus(o, col.dataset.drop); });
});
document.addEventListener("dragend", () => {
  dragId = null;
  document.querySelectorAll(".kan-col.drag-over").forEach(c => c.classList.remove("drag-over"));
});
/** Space/Enter on the tick boxes, for keyboard users. */
document.addEventListener("keydown", e => {
  if ((e.key === " " || e.key === "Enter") && e.target.matches('.check[data-act]')) {
    e.preventDefault();
    ACTIONS[e.target.dataset.act](e.target.dataset, e.target, e);
  }
});

/* ---------- boot ---------- */
db = load();
if (loadFailure) setTimeout(() => toast(loadFailure.split(".")[0] + "."), 400);
const startView = location.hash.replace("#", "");
if (VIEWS[startView]) view = startView;
render();
save();
</script>
