  }).join("");

  const cols5 = "2fr 1.4fr .8fr 1fr 1fr 1fr 96px";
  return header("Enquiries & orders", 'From "how much for a cake?" to paid.') +
    '<section class="card mb" data-form="order">' +
      '<div class="card-title">New enquiry / order</div>' +
      '<div class="form-grid" style="grid-template-columns:1.3fr 1.3fr .6fr .9fr .9fr auto">' +
        field("Customer", selectOf("customerId", customerOptions(), "", "Select…")) +
        field("Product", selectOf("productId", productOptions(), "", "Select…")) +
        field("Qty", '<input type="number" min="1" step="1" data-f="qty" value="1" data-default="1">') +
        field("Date needed", '<input type="date" data-f="date" value="' + todayISO() + '" data-default="' + todayISO() + '">') +
        field("Total " + cur(), '<input type="number" min="0" step="0.01" data-f="total" placeholder="auto" data-enter>') +
        '<button class="btn" data-act="addOrder" data-submit>Add</button>' +
      '</div>' +
      '<p class="hint" style="margin:10px 0 0">Leave the total blank to use the product&rsquo;s suggested price × quantity.</p>' +
    '</section>' +

    '<div class="kanban mb">' + cols + '</div>' +

    '<section class="card">' +
      '<div class="row between" style="margin-bottom:14px">' +
        '<div class="card-title" style="margin:0">All orders</div>' +
        '<div class="row">' +
          '<input placeholder="Search…" aria-label="Search orders" value="' + esc(ui.q || "") + '" data-change="searchOrders" style="width:180px">' +
          '<div class="seg">' + ["all"].concat(STATUSES).map(s =>
            '<button data-act="filterOrders" data-value="' + s + '" aria-pressed="' + (filter === s ? "true" : "false") + '">' +
            (s === "all" ? "All" : STATUS_LABEL[s]) + '</button>').join("") + '</div>' +
        '</div>' +
      '</div>' +
      '<div class="table-wrap">' +
        '<div class="thead" style="grid-template-columns:' + cols5 + '"><span>Customer</span><span>Product</span><span>Qty</span><span>Date</span><span>Total / received</span><span>Status</span><span></span></div>' +
        (rows.length ? rows.map(o =>
          '<div class="trow clickable" style="grid-template-columns:' + cols5 + '" data-act="openOrder" data-id="' + o.id + '">' +
            '<span class="strong">' + esc(customerName(o.customerId)) + '</span>' +
            '<span class="muted">' + esc(productName(o.productId)) + '</span>' +
            '<span class="muted num">' + esc(o.qty || 1) + '</span>' +
            '<span class="muted">' + fmtDate(o.date) + '</span>' +
            '<span class="strong num">' + money(o.total) +
              (receivedOf(o) > 0 || isCommitted(o)
                ? '<br><span class="hint"' + (overpaidBy(o) > 0 ? ' style="color:var(--amber);font-weight:600"' : "") + '>' +
                  money(receivedOf(o)) + ' in' +
                  (outstandingOf(o) > 0 ? ' · ' + money(outstandingOf(o)) + ' due' : "") +
                  (overpaidBy(o) > 0 ? ' · ' + money(overpaidBy(o)) + ' over' : "") + '</span>'
                : "") + '</span>' +
            '<span>' + pill(STATUS_LABEL[o.status], STATUS_TONE[o.status]) +
              (quoteExpired(o) ? '<br>' + pill("Expired", "red") : "") + '</span>' +
            '<span class="row" style="gap:2px;flex-wrap:nowrap">' +
              '<button class="icon-btn" style="color:var(--accent)" data-act="printQuote" data-id="' + o.id + '" title="Print quote / invoice">&#9113;</button>' +
              delBtn("deleteOrder", o.id, "Delete order") +
            '</span>' +
          '</div>').join("") : emptyRow("No orders match. Add one above.")) +
      '</div>' +
      (hidden > 0
        ? '<div class="row between" style="padding-top:14px">' +
            '<span class="hint">Showing the newest ' + rows.length + ' of ' + matched.length + ' orders.</span>' +
            '<button class="btn ghost sm" data-act="showAllOrders">Show all ' + matched.length + '</button>' +
          '</div>'
        : (ui.showAllOrders && matched.length > LIMIT
            ? '<div class="row between" style="padding-top:14px"><span class="hint">Showing all ' + matched.length + ' orders.</span>' +
              '<button class="btn ghost sm" data-act="showFewerOrders">Show newest ' + LIMIT + '</button></div>'
            : "")) +
    '</section>';
};

/** Order detail dialog — edit the order, and record cash against it.
    Payments are their own records: they survive status changes in both
    directions and are the single source of every "received" figure. */
function openOrderModal(id) {
  const o = db.orders.find(x => x.id === id);
  if (!o) return;
  const bal = balanceOf(o), got = receivedOf(o), pays = paymentsOf(o);
  const archivedNote = c => (c && c.archived ? " (archived)" : "");
  const custOpts = customerOptions(o.customerId), prodOpts = productOptions(o.productId);

  modal(customerName(o.customerId), productName(o.productId) + " · " + fmtLongDate(o.date),
    '<div data-form="editOrder" data-id="' + o.id + '">' +
      '<div class="form-grid" style="grid-template-columns:1fr 1fr">' +
        field("Customer", selectOf("customerId", custOpts, o.customerId)) +
        field("Product", selectOf("productId", prodOpts, o.productId)) +
        field("Quantity", '<input type="number" min="1" step="1" data-f="qty" value="' + esc(o.qty || 1) + '">') +
        field("Date needed", '<input type="date" data-f="date" value="' + esc(o.date) + '">') +
        field("Total " + cur(), '<input type="number" min="0" step="0.01" data-f="total" value="' + esc(o.total) + '">') +
        field("Deposit required " + cur(), '<input type="number" min="0" step="0.01" data-f="depositRequired" value="' + esc(num(o.depositRequired)) + '">') +
        field("Status", selectOf("status", STATUSES.map(st => ({ value: st, label: STATUS_LABEL[st] })), o.status)) +
        field("Balance outstanding", '<input value="' + money(bal) + '" disabled>') +
      '</div>' +
      field("Notes", '<textarea data-f="notes" rows="2" placeholder="Flavour, inscription, delivery details…">' + esc(o.notes) + '</textarea>') +

      '<div style="margin:18px 0 0;border-top:1px solid var(--line);padding-top:16px">' +
        '<div class="row between" style="margin-bottom:10px">' +
          '<span class="strong" style="font-size:14px">Payments received</span>' +
          '<span class="hint">' + money(got) + ' of ' + money(o.total) +
            (num(o.depositRequired) > 0 ? ' · deposit ' + (depositDue(o) > 0 ? money(depositDue(o)) + ' still due' : 'covered') : "") + '</span>' +
        '</div>' +
        (overpaidBy(o) > 0 ? '<div class="alert amber" style="margin-bottom:10px"><span class="dot"></span>' +
          'Overpaid by ' + money(overpaidBy(o)) + ' — check for a payment entered twice.</div>' : "") +
        '<div>' +
        '</div>' +
        (pays.length ? pays.slice().sort((a, b) => a.date.localeCompare(b.date)).map(pay =>
          '<div class="row between" style="padding:7px 0;border-bottom:1px solid var(--line)">' +
            '<span style="font-size:14px">' + money(pay.amount) + '<span class="hint"> · ' + fmtDate(pay.date) +
              (pay.note ? ' · ' + esc(pay.note) : "") + '</span></span>' +
            '<button class="icon-btn" data-act="deletePayment" data-id="' + o.id + '" data-pay="' + pay.id + '">&#10005;</button>' +
          '</div>').join("")
          : '<p class="hint" style="margin:0 0 8px">No money received yet.</p>') +
        '<div class="form-grid" style="grid-template-columns:1fr 1fr auto;margin-top:12px">' +
          field("Amount " + cur(), '<input type="number" min="0" step="0.01" data-f="payAmount" placeholder="' + esc(bal > 0 ? bal : 0) + '">') +
          field("Received on", '<input type="date" data-f="payDate" value="' + todayISO() + '">') +
          '<button class="btn primary" data-act="addPayment" data-id="' + o.id + '">Record</button>' +
        '</div>' +
        '<div class="row" style="margin-top:12px">' +
          (depositDue(o) > 0 ? '<button class="btn ghost sm" data-act="payDeposit" data-id="' + o.id + '">Record deposit ' + money(depositDue(o)) + '</button>' : "") +
          (bal > 0 ? '<button class="btn ghost sm" data-act="markPaid" data-id="' + o.id + '">Record balance ' + money(bal) + '</button>' : "") +
        '</div>' +
      '</div>' +

      '<div class="row" style="margin-top:16px">' +
        '<button class="btn ghost sm" data-act="printQuote" data-id="' + o.id + '">Print quote</button>' +
        '<button class="btn ghost sm" data-act="printInvoice" data-id="' + o.id + '">Print invoice</button>' +
      '</div>' +
      (o.costSnapshot ? '<p class="hint" style="margin:12px 0 0">Cost locked at ' + money(o.costSnapshot.unit) +
        ' per unit on ' + fmtLongDate(o.costSnapshot.at) + ' — later ingredient price changes will not alter this order.</p>' : "") +
    '</div>',
    [{ label: "Delete", act: "deleteOrder", cls: "danger", data: ' data-id="' + o.id + '"' },
     { label: "Cancel", act: "closeModal" },
     { label: "Save changes", act: "saveOrder", cls: "primary", data: ' data-id="' + o.id + '"' }]);
}

/* ============================================================
   Module: Customers
   ============================================================ */
VIEWS.customers = function () {
  const stats = c => {
    const list = db.orders.filter(o => o.customerId === c.id);
    // Cash actually received from them — the same basis the export uses.
    return { list, count: list.length, spend: round2(sum(list, receivedOf)) };
  };
  const rows = db.customers
    .map(c => Object.assign({ c }, stats(c)))
    .sort((a, b) => (a.c.archived ? 1 : 0) - (b.c.archived ? 1 : 0) || b.spend - a.spend);
  const archivedCount = db.customers.filter(c => c.archived).length;
  const grid = "1.5fr 1.6fr 1fr .7fr 1fr 40px";

  return header("Customers", "Lifetime value, tracked automatically.") +
    '<section class="card mb" data-form="customer">' +
      '<div class="card-title">Add customer</div>' +
      '<div class="form-grid" style="grid-template-columns:1.3fr 1.5fr 1fr auto">' +
        field("Name", input("name", 'placeholder="Maria Torres" data-enter')) +
        field("Email", input("email", 'type="email" placeholder="maria@example.com"')) +
        field("Phone", input("phone", 'placeholder="555-0142"')) +
        '<button class="btn" data-act="addCustomer" data-submit>Add</button>' +
      '</div>' +
    '</section>' +
    '<section class="card"><div class="table-wrap">' +
      '<div class="thead" style="grid-template-columns:' + grid + '"><span>Name</span><span>Email</span><span>Phone</span><span>Orders</span><span>Paid to date</span><span></span></div>' +
      (rows.length ? rows.map(r => {
        const open = ui.openCustomer === r.c.id;
        return '<div>' +
          '<div class="trow clickable" style="grid-template-columns:' + grid + '" data-act="toggleCustomer" data-id="' + r.c.id + '">' +
            '<span class="strong">' + esc(r.c.name) + (r.c.archived ? ' ' + pill("Archived", "grey") : "") + '</span>' +
            '<span class="muted">' + esc(r.c.email || "—") + '</span>' +
            '<span class="muted">' + esc(r.c.phone || "—") + '</span>' +
            '<span class="muted num">' + r.count + '</span>' +
            '<span class="strong num">' + money(r.spend) + '</span>' +
            '<span>' + (r.c.archived
              ? '<button class="btn ghost sm" data-act="restoreCustomer" data-id="' + r.c.id + '">Restore</button>'
              : delBtn("deleteCustomer", r.c.id, "Delete or archive customer")) + '</span>' +
          '</div>' +
          (open ? '<div style="background:var(--bg);border-radius:10px;padding:16px 18px;margin:8px 0">' +
            '<div class="row between" style="margin-bottom:10px">' +
              '<span class="hint strong">ORDER HISTORY</span>' +
              '<button class="btn ghost sm" data-act="editCustomer" data-id="' + r.c.id + '">Edit details</button>' +
            '</div>' +
            (r.c.notes ? '<p class="muted" style="margin:0 0 10px">' + esc(r.c.notes) + '</p>' : "") +
            (r.list.length ? r.list.sort((a, b) => b.date.localeCompare(a.date)).map(o =>
              '<div class="row between" style="padding:6px 0;font-size:14px">' +
                '<span>' + esc(productName(o.productId)) + (num(o.qty) > 1 ? " ×" + o.qty : "") + ' — ' + money(o.total) + '</span>' +
                '<span class="muted">' + fmtDate(o.date) + ' · ' + STATUS_LABEL[o.status] + '</span></div>').join("")
              : '<p class="hint" style="margin:0">No orders yet.</p>') +
          '</div>' : "") +
        '</div>';
      }).join("") : emptyRow("No customers yet — add your first above.")) +
      (archivedCount ? '<p class="hint" style="margin:14px 0 0">' + archivedCount +
        ' archived customer' + (archivedCount === 1 ? "" : "s") + ' kept for their order history.</p>' : "") +
    '</div></section>';
};

function openCustomerModal(id) {
  const c = customerById(id);
  if (!c) return;
  modal("Edit customer", c.name,
    '<div data-form="editCustomer">' +
      '<div class="form-grid" style="grid-template-columns:1fr 1fr">' +
        field("Name", '<input data-f="name" value="' + esc(c.name) + '">') +
        field("Email", '<input type="email" data-f="email" value="' + esc(c.email || "") + '">') +
        field("Phone", '<input data-f="phone" value="' + esc(c.phone || "") + '">') +
      '</div>' +
      field("Notes", '<textarea data-f="notes" rows="3" placeholder="Allergies, preferences, delivery quirks…">' + esc(c.notes || "") + '</textarea>') +
    '</div>',
    [{ label: "Cancel", act: "closeModal" }, { label: "Save", act: "saveCustomer", cls: "primary", data: ' data-id="' + c.id + '"' }]);
}
</script>
<script>
/* ============================================================
   Module: Products, recipe costing & allergens
   ============================================================ */
VIEWS.products = function () {
  const grid = "1.6fr .9fr .9fr .9fr .8fr 96px";
  const agrid = "1.6fr repeat(" + ALLERGENS.length + ",1fr)";
  const sold = id => sum(db.orders.filter(o => o.productId === id && isCommitted(o)), o => num(o.qty || 1));

  return header("Products, recipe costing & allergens", "Know your cost before you bake.") +
    '<section class="card mb" data-form="product">' +
      '<div class="card-title">Add product / recipe</div>' +
      '<div class="form-grid" style="grid-template-columns:1.6fr 1.2fr repeat(4,.9fr)">' +
        field("Product name", input("name", 'placeholder="Classic Vanilla Cake" data-enter')) +
        field("Category", input("category", 'placeholder="Custom cakes" list="bbos-categories"')) +
        field("Ingredients " + cur(), input("ingCost", 'type="number" min="0" step="0.01" placeholder="0.00"')) +
        field("Labour " + cur(), input("labour", 'type="number" min="0" step="0.01" placeholder="0.00"')) +
        field("Overhead " + cur(), input("overhead", 'type="number" min="0" step="0.01" placeholder="0.00"')) +
        field("Margin %", input("margin", 'type="number" min="0" max="95" step="1" value="' + esc(db.settings.defaultMargin) + '" data-default="' + esc(db.settings.defaultMargin) + '"')) +
      '</div>' +
      '<datalist id="bbos-categories">' + [...new Set(db.products.map(p => p.category).filter(Boolean))].map(c => '<option value="' + esc(c) + '">').join("") + '</datalist>' +
      '<div class="row" style="margin:14px 0 4px"><span class="hint">Allergens:</span>' +
        ALLERGENS.map(a => '<label class="checkbox"><input type="checkbox" data-f="' + esc(a) + '" data-group="allergens">' + esc(a) + '</label>').join("") +
      '</div>' +
      '<div class="row between" style="margin-top:14px">' +
        '<span class="hint">Price is calculated for you from the formula below.</span>' +
        '<button class="btn" data-act="addProduct" data-submit>Add product</button>' +
      '</div>' +
    '</section>' +

    '<div class="formula mb">price = (ingredients + labour + overhead) &divide; (1 &minus; margin %)</div>' +

    '<section class="card mb"><div class="card-title">Products</div><div class="table-wrap">' +
      '<div class="thead" style="grid-template-columns:' + grid + '"><span>Product</span><span>Unit cost</span><span>Price</span><span>Profit</span><span>Sold</span><span></span></div>' +
      (db.products.length ? db.products.slice()
        .sort((a, b) => (a.archived ? 1 : 0) - (b.archived ? 1 : 0)).map(p => {
        const c = costing(p);
        return '<div class="trow" style="grid-template-columns:' + grid + '">' +
          '<span><span class="strong">' + esc(p.name) + '</span>' + (p.archived ? ' ' + pill("Archived", "grey") : "") +
            (p.category ? '<br><span class="hint">' + esc(p.category) + '</span>' : "") + '</span>' +
          '<span class="muted num">' + money(c.cost) +
            (c.fromRecipe ? '<br><span class="hint">' + (p.recipe || []).length + ' ingredients</span>' : "") + '</span>' +
          '<span class="strong num">' + money(c.price) + '</span>' +
          '<span class="strong num" style="color:var(--green)">' + money(c.profit) + ' <span class="hint">(' + Math.round(c.marginPct) + '%)</span></span>' +
          '<span class="muted num">' + sold(p.id) + '</span>' +
          '<span class="row" style="gap:2px;flex-wrap:nowrap">' +
            (p.archived
              ? '<button class="btn ghost sm" data-act="restoreProduct" data-id="' + p.id + '">Restore</button>'
              : '<button class="btn ghost sm" data-act="editProduct" data-id="' + p.id + '">Edit</button>' +
                delBtn("deleteProduct", p.id, "Delete or archive product")) +
          '</span>' +
        '</div>';
      }).join("") : emptyRow("No products yet — add your first recipe above.")) +
    '</div></section>' +

    '<div class="grid wide-narrow">' +
      card("Allergen matrix",
        '<div class="table-wrap">' +
          '<div class="thead" style="grid-template-columns:' + agrid + '"><span>Product</span>' +
            ALLERGENS.map(a => '<span style="text-align:center">' + esc(a) + '</span>').join("") + '</div>' +
          (db.products.length ? db.products.filter(p => !p.archived).map(p =>
            '<div class="trow" style="grid-template-columns:' + agrid + '">' +
              '<span class="strong">' + esc(p.name) + '</span>' +
              ALLERGENS.map(a => (p.allergens || []).includes(a)
                ? '<span style="text-align:center;color:var(--red);font-weight:700" title="Contains ' + esc(a) + '">&#9679;</span>'
                : '<span style="text-align:center;color:var(--ink-45)">&mdash;</span>').join("") +
            '</div>').join("") : emptyRow("Add a product to build your matrix.")) +
        '</div>' +
        '<p class="hint" style="margin:14px 0 0">Set an allergen once — it flows to every order, bake sheet and printed label.</p>') +
      card("Print allergen labels",
        '<p class="hint" style="margin-top:0">Ready-to-cut labels with product name, weight and a CONTAINS line — for market stalls and boxes.</p>' +
        '<div data-form="labels" class="stack" style="gap:10px">' +
          field("Product", selectOf("productId", productOptions(), "", "All active products")) +
          field("Net weight (optional)", input("weight", 'placeholder="120g"')) +
          field("Labels per product", input("copies", 'type="number" min="1" max="40" value="6"')) +
          '<button class="btn block" data-act="printLabels">Print labels</button>' +
        '</div>') +
    '</div>';
};

/** Rows of the recipe editor, read straight back out of the dialog. */
function readRecipe(el) {
  const form = formOf(el);
  if (!form) return [];
  return [...form.querySelectorAll(".recipe-row")].map(row => ({
    ingredientId: row.querySelector("[data-r-ing]").value,
    qty: num(row.querySelector("[data-r-qty]").value)
  })).filter(r => r.ingredientId && r.qty > 0);
}

function readRecipeRaw(el) {
  const form = formOf(el);
  if (!form) return [];
  return [...form.querySelectorAll(".recipe-row")].map(row => ({
    ingredientId: row.querySelector("[data-r-ing]").value,
    qty: num(row.querySelector("[data-r-qty]").value)
  }));
}

function recipeEditor(lines) {
  const opts = db.ingredients.map(i => ({ value: i.id, label: i.name + " (" + i.unit + ")" }));
  const row = (line, idx) => {
    const i = byId(db.ingredients, line.ingredientId);
    return '<div class="recipe-row" style="display:grid;grid-template-columns:1.7fr .7fr auto auto;gap:8px;align-items:center;margin-bottom:8px">' +
      '<select data-r-ing>' + opts.map(o => '<option value="' + esc(o.value) + '"' +
        (o.value === line.ingredientId ? " selected" : "") + '>' + esc(o.label) + '</option>').join("") + '</select>' +
      '<input type="number" min="0" step="0.01" data-r-qty value="' + esc(line.qty) + '">' +
      '<span class="hint num" style="min-width:56px;text-align:right">' +
        (i ? money(num(line.qty) * num(i.cost)) : "—") + '</span>' +
      '<button class="icon-btn" data-act="removeRecipeLine" data-index="' + idx + '">&#10005;</button>' +
    '</div>';
  };
  return '<div style="margin:16px 0">' +
    '<div class="row between" style="margin-bottom:8px">' +
      '<span class="strong" style="font-size:14px">Recipe — one batch</span>' +
      '<button class="btn ghost sm" data-act="addRecipeLine">+ Ingredient</button>' +
    '</div>' +
    (lines.length ? lines.map(row).join("")
      : '<p class="hint" style="margin:0 0 8px">No recipe yet. Add ingredients and the cost is priced from your inventory automatically.</p>') +
  '</div>';
}

let currentProductId = null;
function openProductModal(id, draft) {
  const p = productById(id);
  if (!p) return;
  currentProductId = id;
  const c = costing(p);
  const d = draft || {};
  const lines = d.recipe || (p.recipe || []).slice();
  const val = (k, fallback) => esc(d[k] !== undefined ? d[k] : fallback);
  const checked = a => (d.allergens ? d.allergens.includes(a) : (p.allergens || []).includes(a));
  modal("Edit product", p.name,
    '<div data-form="editProduct">' +
      '<div class="form-grid" style="grid-template-columns:1fr 1fr">' +
        field("Name", '<input data-f="name" value="' + val("name", p.name) + '">') +
        field("Category", '<input data-f="category" value="' + val("category", p.category || "") + '">') +
        field("Labour " + cur(), '<input type="number" min="0" step="0.01" data-f="labour" value="' + val("labour", p.labour) + '">') +
        field("Overhead " + cur(), '<input type="number" min="0" step="0.01" data-f="overhead" value="' + val("overhead", p.overhead) + '">') +
        field("Margin %", '<input type="number" min="0" max="95" step="1" data-f="margin" value="' + val("margin", p.margin) + '">') +
        field(lines.length ? "Ingredients " + cur() + " (from recipe)" : "Ingredients " + cur(),
          lines.length
            ? '<input value="' + esc(money(sum(lines, l => {
                const i = byId(db.ingredients, l.ingredientId);
                return i ? num(l.qty) * num(i.cost) : 0;
              }))) + '" disabled>'
            : '<input type="number" min="0" step="0.01" data-f="ingCost" value="' + val("ingCost", p.ingCost) + '">') +
      '</div>' +
      recipeEditor(lines) +
      '<div class="row" style="margin:14px 0"><span class="hint">Allergens:</span>' +
        ALLERGENS.map(a => '<label class="checkbox"><input type="checkbox" data-f="' + esc(a) + '" data-group="allergens"' +
          (checked(a) ? " checked" : "") + '>' + esc(a) + '</label>').join("") + '</div>' +
      '<div class="alert green" style="justify-content:space-between">' +
        '<span>Current: cost ' + money(c.cost) + ' · price ' + money(c.price) + ' · profit ' + money(c.profit) + '</span></div>' +
    '</div>',
    [{ label: "Cancel", act: "closeModal" }, { label: "Save", act: "saveProduct", cls: "primary", data: ' data-id="' + p.id + '"' }]);
}

/* ============================================================
   Module: Inventory
   ============================================================ */
VIEWS.inventory = function () {
  const grid = "1.5fr .9fr 1fr 1.3fr 40px";
  const low = lowStock();
  const rows = db.ingredients.slice().sort((a, b) => {
    const rank = { expired: 0, expiring: 1, out: 2, low: 3, good: 4 };
    return rank[ingredientStatus(a).key] - rank[ingredientStatus(b).key];
  });

  return header("Inventory", "Never run out mid-order.") +
    '<section class="card mb" data-form="ingredient">' +
      '<div class="card-title">Add ingredient</div>' +
      '<div class="form-grid" style="grid-template-columns:1.5fr .8fr .8fr .8fr .9fr 1fr auto">' +
        field("Ingredient", input("name", 'placeholder="Cake flour" data-enter')) +
        field("Unit", '<select data-f="unit"><option>kg</option><option>g</option><option>L</option><option>ml</option><option>units</option></select>') +
        field("In stock", input("stock", 'type="number" min="0" step="0.01" placeholder="0"')) +
        field("Reorder at", input("reorder", 'type="number" min="0" step="0.01" placeholder="0"')) +
        field("Cost per unit " + cur(), input("cost", 'type="number" min="0" step="0.01" placeholder="0.00"')) +
        field("Expiry", '<input type="date" data-f="expiry">') +
        '<button class="btn" data-act="addIngredient" data-submit>Add</button>' +
      '</div>' +
    '</section>' +

    '<div class="grid wide-narrow">' +
      '<section class="card"><div class="table-wrap">' +
        '<div class="thead" style="grid-template-columns:' + grid + '"><span>Ingredient</span><span>In stock</span><span>Expires</span><span>Status</span><span></span></div>' +
        (rows.length ? rows.map(i => {
          const s = ingredientStatus(i);
          const days = i.expiry ? daysUntil(i.expiry) : null;
          return '<div class="trow" style="grid-template-columns:' + grid + '">' +
            '<span><span class="strong">' + esc(i.name) + '</span><br><span class="hint">' + money(num(i.cost)) + ' / ' + esc(i.unit) + '</span></span>' +
            '<span class="num"><button class="icon-btn" style="color:var(--ink-45)" data-act="adjustStock" data-id="' + i.id + '" data-by="-1" aria-label="Decrease">&minus;</button> ' +
              esc(num(i.stock)) + ' ' + esc(i.unit) +
              ' <button class="icon-btn" style="color:var(--ink-45)" data-act="adjustStock" data-id="' + i.id + '" data-by="1" aria-label="Increase">+</button></span>' +
            '<span class="muted" style="font-size:12.5px">' + (i.expiry ? fmtDate(i.expiry) + '<br><span class="hint">' +
              (days < 0 ? Math.abs(days) + "d ago" : days + "d left") + '</span>' : "—") + '</span>' +
            '<span>' + pill(s.label, s.tone) +
              (["low", "out"].includes(s.key) ? '<div class="hint" style="color:var(--amber);margin-top:3px">Reorder ' +
                Math.max(1, Math.ceil(num(i.reorder) * 2 - num(i.stock))) + ' ' + esc(i.unit) + '</div>' : "") + '</span>' +
            '<span>' + delBtn("deleteIngredient", i.id, "Delete ingredient") + '</span>' +
          '</div>';
        }).join("") : emptyRow("No ingredients tracked yet.")) +
      '</div></section>' +
      '<div class="stack">' +
        '<section class="card dark">' +
          '<div style="color:var(--accent);font-weight:700;font-size:13px;letter-spacing:.06em">STOCK VALUE</div>' +
          '<div style="font-size:32px;font-weight:800;margin-top:6px" class="num">' + money0(stockValue()) + '</div>' +
          '<div style="opacity:.6;font-size:13px;margin-top:4px">' + db.ingredients.length + ' ingredients tracked</div>' +
        '</section>' +
        card("Shopping list",
          '<p class="muted" style="margin:0 0 12px">' + low.length + ' item' + (low.length === 1 ? "" : "s") + ' below reorder level.</p>' +
          (low.length ? '<div style="margin-bottom:12px">' + low.map(i =>
            '<div class="row between" style="padding:5px 0;font-size:14px"><span>' + esc(i.name) + '</span>' +
            '<span class="muted">' + esc(num(i.stock)) + " / " + esc(num(i.reorder)) + ' ' + esc(i.unit) + '</span></div>').join("") + '</div>' : "") +
          '<button class="btn ghost block" data-act="printShoppingList">Print shopping list</button>') +
        card("Expiring within 14 days",
          expiringSoon().length ? expiringSoon().map(i =>
            '<div class="alert red" style="margin-bottom:8px"><span class="dot"></span>' + esc(i.name) + ' · ' + fmtDate(i.expiry) + '</div>').join("")
            : '<div class="alert green"><span class="dot"></span>Nothing expiring soon.</div>') +
      '</div>' +
    '</div>';
};

/* ============================================================
   Module: Payments, expenses & P&L
   ============================================================ */
VIEWS.payments = function () {
  const committed = db.orders.filter(isCommitted);
  const bookedSales = round2(sum(committed, o => num(o.total)));
  const totalReceived = round2(sum(db.orders, receivedOf));
  const totalOutstanding = round2(sum(db.orders, outstandingOf));
  const expected = round2(sum(db.orders.filter(o => ["quoted", "enquiry"].includes(o.status)), o => num(o.total)));
  const totalExpenses = round2(sum(db.expenses, e => num(e.amount)));
  const totalCogs = round2(sum(committed, orderCost));
  const months = lastMonths(6);
  const net = round2(bookedSales - totalCogs - totalExpenses);
  const grid = "1.6fr 1.2fr 1fr .9fr 40px";

  const stat = (label, value, color) =>
    '<div class="card"><div class="kpi-label">' + esc(label) + '</div>' +
    '<div class="num" style="font-size:26px;font-weight:700;margin-top:6px' + (color ? ";color:" + color : "") + '">' + esc(value) + '</div></div>';

  return header("Payments, expenses & P&L", "Know exactly how the business is doing.") +
    '<div class="grid kpis mb">' +
      stat("Booked sales", money0(bookedSales)) +
      stat("Cash received", money0(totalReceived), "var(--green)") +
      stat("Outstanding", money0(totalOutstanding), "var(--amber)") +
      stat("Expenses + cost of goods", money0(totalExpenses + totalCogs), "var(--red)") +
      '<div class="card dark"><div style="opacity:.6;font-size:14px">Net profit</div>' +
        '<div class="num" style="color:var(--accent);font-size:26px;font-weight:800;margin-top:6px">' + money0(net) + '</div></div>' +
    '</div>' +
    (() => { const over = round2(sum(db.orders, overpaidBy));
      return over > 0 ? '<div class="alert amber mb"><span class="dot"></span>' + money(over) +
        ' has been received beyond what was charged. Check the orders marked "over" for a payment entered twice.</div>' : ""; })() +
    '<p class="hint" style="margin:-8px 0 20px">Booked sales are orders the customer has agreed to. Cash received is money actually ' +
      'in your hands. Profit is booked sales less cost of goods (' + money0(totalCogs) + ') and expenses (' + money0(totalExpenses) + ')' +
      (expected > 0 ? ' — a further ' + money0(expected) + ' sits in open enquiries and quotes.' : '.') + '</p>' +

    '<section class="card mb">' +
      '<div class="row between" style="margin-bottom:16px">' +
        '<div class="card-title" style="margin:0">Monthly revenue vs profit</div>' +
        '<div class="legend"><span><i class="swatch"></i>Booked sales</span>' +
          '<span><i class="swatch green"></i>Cash received</span><span><i class="swatch ink"></i>Net profit</span></div>' +
      '</div>' +
      barChart(months.map(m => ({ label: m.label, values: [
        { v: Math.max(0, m.bookedSales), title: "Booked sales " + money(m.bookedSales) },
        { v: Math.max(0, m.cashReceived), cls: "green", title: "Cash received " + money(m.cashReceived) },
        { v: Math.max(0, m.profit), cls: "ink", title: "Net profit " + money(m.profit) }
      ] })), 200) +
      '<div class="row between" style="margin-top:14px;border-top:1px solid var(--line);padding-top:12px">' +
        '<span class="hint">Net profit = booked sales &minus; cost of goods &minus; expenses</span>' +
        '<button class="btn ghost sm" data-act="printPL">Print profit &amp; loss</button>' +
      '</div>' +
    '</section>' +

    '<div class="grid wide-narrow">' +
      '<section class="card" data-form="expense">' +
        '<div class="card-title">Expenses</div>' +
        '<div class="form-grid" style="grid-template-columns:1.5fr .9fr 1fr auto;margin-bottom:16px">' +
          field("Category", input("category", 'placeholder="Packaging" list="bbos-expcats" data-enter')) +
          field("Amount " + cur(), input("amount", 'type="number" min="0" step="0.01" placeholder="0.00"')) +
          field("Date", '<input type="date" data-f="date" value="' + todayISO() + '" data-default="' + todayISO() + '">') +
          '<button class="btn" data-act="addExpense" data-submit>Add</button>' +
        '</div>' +
        '<datalist id="bbos-expcats">' + [...new Set(db.expenses.map(e => e.category))].map(c => '<option value="' + esc(c) + '">').join("") + '</datalist>' +
        '<div class="table-wrap">' +
          '<div class="thead" style="grid-template-columns:' + grid + '"><span>Category</span><span>Notes</span><span>Date</span><span>Amount</span><span></span></div>' +
          (db.expenses.length ? db.expenses.slice().sort((a, b) => b.date.localeCompare(a.date)).map(e =>
            '<div class="trow" style="grid-template-columns:' + grid + '">' +
              '<span class="strong">' + esc(e.category) + '</span>' +
              '<span class="muted">' + esc(e.notes || "—") + '</span>' +
              '<span class="muted">' + fmtDate(e.date) + '</span>' +
              '<span class="strong num" style="color:var(--red)">' + money(e.amount) + '</span>' +
              '<span>' + delBtn("deleteExpense", e.id, "Delete expense") + '</span>' +
            '</div>').join("") : emptyRow("No expenses logged yet.")) +
        '</div>' +
      '</section>' +
      '<div class="stack">' +
        card("Awaiting payment",
          (() => {
            const owed = db.orders.filter(o => outstandingOf(o) > 0).sort((a, b) => a.date.localeCompare(b.date));
            return owed.length ? owed.map(o =>
              '<div class="row between" style="padding:9px 0;border-bottom:1px solid var(--line)">' +
                '<span><span class="strong">' + esc(customerName(o.customerId)) + '</span><br><span class="hint">' + fmtDate(o.date) +
                  (daysUntil(o.date) < 0 ? ' · overdue' : "") +
                  (receivedOf(o) > 0 ? ' · ' + money(receivedOf(o)) + ' received' : "") + '</span></span>' +
                '<span class="row" style="flex-wrap:nowrap"><span class="strong num">' + money(balanceOf(o)) + '</span>' +
                '<button class="btn ghost sm" data-act="markPaid" data-id="' + o.id + '">Paid</button></span>' +
              '</div>').join("") : '<div class="alert green"><span class="dot"></span>Everything is settled.</div>';
          })()) +
        card("This month",
          (() => { const m = monthStats(todayISO().slice(0, 7)); return '' +
            '<div class="row between" style="padding:6px 0"><span class="muted">Booked sales</span><span class="strong num">' + money(m.bookedSales) + '</span></div>' +
            '<div class="row between" style="padding:6px 0"><span class="muted">Cost of goods</span><span class="num">' + money(m.cogs) + '</span></div>' +
            '<div class="row between" style="padding:6px 0"><span class="muted">Expenses</span><span class="num">' + money(m.expenses) + '</span></div>' +
            '<div class="row between" style="padding:10px 0;border-top:1px solid var(--line);margin-top:6px">' +
              '<span class="strong">Net profit</span><span class="strong num" style="color:var(--accent)">' + money(m.profit) + '</span></div>' +
            '<div class="row between" style="padding:6px 0;border-top:1px solid var(--line)"><span class="muted">Cash received</span>' +
              '<span class="num" style="color:var(--green)">' + money(m.cashReceived) + '</span></div>' +
            '<div class="row between" style="padding:6px 0"><span class="muted">Still outstanding</span>' +
              '<span class="num" style="color:var(--amber)">' + money(m.outstanding) + '</span></div>'; })()) +
      '</div>' +
    '</div>';
};
</script>
<script>
/* ============================================================
   Module: Tasks, bake log, waste & social
   ============================================================ */
VIEWS.kitchen = function () {
  const tasks = db.tasks.slice().sort((a, b) => (a.done - b.done) || String(a.due || "").localeCompare(String(b.due || "")));
  const wasteCost = sum(db.waste, w => num(w.cost));

  return header("Tasks, bake log, waste & social", "Everything that keeps the kitchen running.") +
    '<div class="grid two mb">' +
      '<section class="card" data-form="task">' +
        '<div class="card-title">Tasks</div>' +
        '<div class="form-grid" style="grid-template-columns:2fr 1fr auto;margin-bottom:14px">' +
          field("Task", input("text", 'placeholder="Restock vanilla extract" data-enter')) +
          field("Due", '<input type="date" data-f="due">') +
          '<button class="btn" data-act="addTask" data-submit>Add</button>' +
        '</div>' +

            '<span style="flex:1;font-size:14.5px" class="' + (t.done ? "done" : "") + '">' + esc(t.text) + '</span>' +
            (t.due ? '<span class="hint"' + (overdue ? ' style="color:var(--red);font-weight:600"' : "") + '>' + fmtDate(t.due) + '</span>' : "") +
            delBtn("deleteTask", t.id, "Delete task") +
          '</div>';
        }).join("") : emptyRow("Nothing on the list. Rare and precious.")) +
      '</section>' +

      '<section class="card" data-form="bake">' +
        '<div class="card-title">Bake log</div>' +
        '<div class="form-grid" style="grid-template-columns:2fr .7fr auto;margin-bottom:6px">' +
          field("Product", selectOf("productId", productOptions(), "", "Select product…")) +

          '<div class="row between" style="padding:9px 0;border-bottom:1px solid var(--line)">' +

            '<span class="row" style="flex-wrap:nowrap"><span class="hint">' + fmtDate(b.date) + '</span>' + delBtn("deleteBake", b.id, "Delete bake") + '</span>' +
          '</div>').join("") : emptyRow("No bakes logged yet.")) +
      '</section>' +
    '</div>' +

    '<div class="grid two">' +
      '<section class="card" data-form="waste">' +
        '<div class="row between" style="margin-bottom:14px">' +
          '<div class="card-title" style="margin:0">Waste tracking</div>' +
          '<span class="pill red">' + money(wasteCost) + ' wasted</span>' +
        '</div>' +
        '<div class="form-grid" style="grid-template-columns:1.3fr .7fr 1.2fr .7fr auto;margin-bottom:14px">' +

          field("Caption idea", input("caption", 'placeholder="Behind the scenes: Maria\'s cake" data-enter')) +

          field("Date", '<input type="date" data-f="date" value="' + todayISO() + '" data-default="' + todayISO() + '">') +

/* ============================================================

          : "This will permanently delete everything stored on this device.") + '</p>' +
        '<div class="row">' +
          '<button class="btn danger" data-act="resetEmpty">Clear all data</button>' +
          '<button class="btn neutral" data-act="resetSample">Reload sample data</button>' +
        '</div>') +
    '</div>';
};
</script>
<script>
/* ============================================================
   Printable documents. Rendered into #print-root, then printed
   by the browser — which is also how they become PDFs
   ("Save as PDF" in the print dialog). No libraries needed.
   ============================================================ */
function printDocs(html) {
  $("#print-root").innerHTML = html;
  closeModal();
  const done = () => { $("#print-root").innerHTML = ""; window.removeEventListener("afterprint", done); };
  window.addEventListener("afterprint", done);
  setTimeout(() => window.print(), 60);
}

function docHead(kicker, title, metaLines) {
  const s = db.settings;
  return '<div class="doc-head"><div>' +
      '<div class="doc-kicker">' + esc(kicker) + '</div><h1>' + esc(title) + '</h1>' +
      '<div class="muted" style="margin-top:6px">' + esc(s.bakeryName) + '</div>' +
    '</div><div class="doc-meta">' +
      metaLines.map(l => esc(l)).join("<br>") +
      '<br>' + esc(s.email || "") + (s.phone ? "<br>" + esc(s.phone) : "") + (s.address ? "<br>" + esc(s.address) : "") +
    '</div></div>';
}

function orderDoc(o, kind) {
  const c = customerById(o.customerId) || { name: "—" };
  const p = productById(o.productId);
  const qty = num(o.qty) || 1;
  const unit = num(o.total) / qty;
  const isInvoice = kind === "invoice";
  const got = receivedOf(o), bal = balanceOf(o), pays = paymentsOf(o);
  const ref = o.id.slice(-6).toUpperCase();
  const meta = isInvoice
    ? ["Invoice #" + ref, "Issued " + fmtLongDate(todayISO()), "Order date " + fmtLongDate(o.date)]
    : ["Quote #" + ref, "Raised " + fmtLongDate(o.createdAt || o.date), "Valid until " + fmtLongDate(quoteExpiry(o))];

  return '<div class="doc">' + docHead(isInvoice ? "Invoice" : "Quote", c.name, meta) +
    '<table><thead><tr><th>Item</th><th class="r">Qty</th><th class="r">Unit</th><th class="r">Amount</th></tr></thead><tbody>' +
      '<tr><td><strong>' + esc(productName(o.productId)) + '</strong>' +
        (o.notes ? '<br><span style="font-size:12.5px;color:#6b5c4d">' + esc(o.notes) + '</span>' : "") +
        (p && (p.allergens || []).length ? '<br><span style="font-size:11.5px;color:#C0483F;font-weight:700">CONTAINS: ' + esc(p.allergens.join(", ").toUpperCase()) + '</span>' : "") +
      '</td><td class="r">' + qty + '</td><td class="r">' + money(unit) + '</td><td class="r">' + money(o.total) + '</td></tr>' +
    '</tbody></table>' +
    (isInvoice
      ? (pays.length
          ? pays.slice().sort((a, b) => a.date.localeCompare(b.date)).map(pay =>
              '<div style="display:flex;justify-content:space-between;padding:6px 4px"><span>Payment received ' +
              fmtLongDate(pay.date) + (pay.note ? ' — ' + esc(pay.note) : "") + '</span><span>' + money(pay.amount) + '</span></div>').join("") +
            '<div style="display:flex;justify-content:space-between;padding:6px 4px;border-top:1px solid #E8DED0"><span>Total received</span><span>' + money(got) + '</span></div>'
          : '<div style="display:flex;justify-content:space-between;padding:6px 4px"><span>Received to date</span><span>' + money(0) + '</span></div>') +
        '<div class="doc-total"><span>Balance due</span><span>' + money(bal) + '</span></div>'
      : '<div style="display:flex;justify-content:space-between;padding:8px 4px"><span>Deposit to secure your date</span><span>' +
          money(num(o.depositRequired) || round2(num(o.total) * num(db.settings.depositPct) / 100)) + '</span></div>' +
        (got > 0 ? '<div style="display:flex;justify-content:space-between;padding:6px 4px"><span>Already received</span><span>' + money(got) + '</span></div>' : "") +
        '<div class="doc-total"><span>Total</span><span>' + money(o.total) + '</span></div>') +
    '<div class="doc-note">' + esc(db.settings.terms || "") +
      (!isInvoice ? '<br>This quote is valid until ' + fmtLongDate(quoteExpiry(o)) + '.' : "") +
      (isInvoice && bal <= 0 && num(o.total) > 0 ? '<br><strong style="color:#3F8A5C">Paid in full — thank you!</strong>' : "") +
    '</div></div>';
}

function bakeSheetDoc(dateISO) {
  const list = ordersOn(dateISO).filter(o => o.status !== "enquiry");
  const rows = list.map(o => {
    const p = productById(o.productId);
    return '<tr><td><strong>' + esc(productName(o.productId)) + '</strong>' +
      (p && (p.allergens || []).length ? '<br><span style="font-size:11.5px;color:#C0483F;font-weight:700">' + esc(p.allergens.join(", ").toUpperCase()) + '</span>' : "") +
      '</td><td class="r">' + (num(o.qty) || 1) + '</td><td>' + esc(customerName(o.customerId)) + '</td>' +
      '<td>' + esc(o.notes || "—") + '</td></tr>';
  }).join("");
  // Everything the day's orders consume, rolled up across their recipes.
  const needed = {};
  for (const o of list) {
    const p = productById(o.productId);
    if (!p) continue;
    for (const r of recipeLines(p)) {
      const key = r.ingredient.id;
      needed[key] = needed[key] || { name: r.ingredient.name, unit: r.ingredient.unit, qty: 0, stock: num(r.ingredient.stock) };
      needed[key].qty += r.qty * (num(o.qty) || 1);
    }
  }
  const mise = Object.values(needed).sort((a, b) => a.name.localeCompare(b.name));

  return '<div class="doc">' + docHead("Kitchen bake sheet", fmtLongDate(dateISO), [list.length + " order" + (list.length === 1 ? "" : "s"), "Printed " + fmtLongDate(todayISO())]) +
    (list.length
      ? '<table><thead><tr><th>Product</th><th class="r">Qty</th><th>Customer</th><th>Notes</th></tr></thead><tbody>' + rows + '</tbody></table>'
      : '<p class="muted">No orders scheduled for this day.</p>') +
    (mise.length ? '<h3 style="margin-top:26px;font-size:15px">Ingredients needed</h3>' +
      '<table><thead><tr><th>Ingredient</th><th class="r">Needed</th><th class="r">In stock</th></tr></thead><tbody>' +
      mise.map(m => '<tr><td>' + esc(m.name) + '</td><td class="r"><strong>' + (+m.qty.toFixed(2)) + " " + esc(m.unit) +
        '</strong></td><td class="r"' + (m.stock < m.qty ? ' style="color:#C0483F;font-weight:700"' : "") + '>' +
        m.stock + " " + esc(m.unit) + '</td></tr>').join("") + '</tbody></table>' : "") +
    '<div class="doc-note">Tick each item as it leaves the oven. Allergens are listed under every product — double-check before decorating.</div></div>';
}

function shoppingListDoc() {
  const low = lowStock();
  const exp = expiringSoon();
  return '<div class="doc">' + docHead("Shopping list", db.settings.bakeryName, ["Printed " + fmtLongDate(todayISO()), low.length + " item" + (low.length === 1 ? "" : "s") + " to buy"]) +
    (low.length ? '<table><thead><tr><th>Ingredient</th><th class="r">In stock</th><th class="r">Reorder at</th><th class="r">Suggested buy</th></tr></thead><tbody>' +
      low.map(i => '<tr><td><strong>' + esc(i.name) + '</strong></td><td class="r">' + num(i.stock) + " " + esc(i.unit) +
        '</td><td class="r">' + num(i.reorder) + " " + esc(i.unit) + '</td><td class="r"><strong>' +
        Math.max(1, Math.ceil(num(i.reorder) * 2 - num(i.stock))) + " " + esc(i.unit) + '</strong></td></tr>').join("") +
      '</tbody></table>' : '<p class="muted">Everything is above its reorder level.</p>') +
    (exp.length ? '<h3 style="margin-top:26px;font-size:15px">Use up first — expiring soon</h3>' +
      '<table><tbody>' + exp.map(i => '<tr><td>' + esc(i.name) + '</td><td class="r">' + fmtLongDate(i.expiry) + '</td></tr>').join("") + '</tbody></table>' : "") +
    '<div class="doc-note">Estimated cost of this list: ' +
      money(sum(low, i => Math.max(1, Math.ceil(num(i.reorder) * 2 - num(i.stock))) * num(i.cost))) + '</div></div>';
}

function labelsDoc(productId, weight, copies) {
  const list = productId ? [productById(productId)].filter(Boolean) : db.products.filter(p => !p.archived);
  const n = clamp(parseInt(copies, 10) || 6, 1, 40);
  let cells = "";
  for (const p of list) {
    for (let i = 0; i < n; i++) {
      cells += '<div class="label-card" style="break-inside:avoid">' +
        '<div style="font-weight:700;font-size:15px">' + esc(p.name) + '</div>' +
        '<div style="font-size:11.5px;color:#6b5c4d;margin-top:2px">' + esc(db.settings.bakeryName) + (weight ? " · " + esc(weight) : "") + '</div>' +
        '<div class="contains">' + ((p.allergens || []).length ? "CONTAINS: " + esc(p.allergens.join(", ").toUpperCase()) : "NO DECLARED ALLERGENS") + '</div>' +
      '</div>';
    }
  }
  return '<div class="doc"><h1 style="margin-bottom:16px">Allergen labels</h1>' +
    '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px">' + cells + '</div></div>';
}

function plDoc() {
  const months = lastMonths(12);
  const add = (a, m) => ({
    bookedSales: a.bookedSales + m.bookedSales, expenses: a.expenses + m.expenses,
    cogs: a.cogs + m.cogs, profit: a.profit + m.profit, cashReceived: a.cashReceived + m.cashReceived
  });
  const tot = months.reduce(add, { bookedSales: 0, expenses: 0, cogs: 0, profit: 0, cashReceived: 0 });
  const owed = round2(sum(db.orders, outstandingOf));
  return '<div class="doc">' + docHead("Profit & loss", "Last 12 months", ["Printed " + fmtLongDate(todayISO())]) +
    '<table style="font-size:13px"><thead><tr><th>Month</th><th class="r">Orders</th><th class="r">Booked sales</th>' +
      '<th class="r">Cost of goods</th><th class="r">Expenses</th><th class="r">Net profit</th><th class="r">Cash received</th></tr></thead><tbody>' +
    months.map(m => '<tr><td>' + m.label + " " + m.year + '</td><td class="r">' + m.count + '</td><td class="r">' + money(m.bookedSales) +
      '</td><td class="r">' + money(m.cogs) + '</td><td class="r">' + money(m.expenses) +
      '</td><td class="r"><strong>' + money(m.profit) + '</strong></td><td class="r">' + money(m.cashReceived) + '</td></tr>').join("") +
    '</tbody></table>' +
    '<div class="doc-total"><span>Net profit, 12 months</span><span>' + money(tot.profit) + '</span></div>' +
    '<div class="doc-note"><strong>How these are counted.</strong> Booked sales are orders the customer has agreed to ' +
      '(booked or paid), dated by when the order is wanted. Cost of goods is each order&rsquo;s recipe cost, locked at the ' +
      'moment it was committed, so past months do not move when ingredient prices change. Net profit = booked sales ' +
      '&minus; cost of goods &minus; expenses. Cash received is money actually taken in the month, which may fall in a ' +
      'different month from the sale.<br>' +
      '12-month totals — booked sales ' + money(tot.bookedSales) + ' · cost of goods ' + money(tot.cogs) +
      ' · expenses ' + money(tot.expenses) + ' · cash received ' + money(tot.cashReceived) +
      '. Still outstanding across all booked orders: ' + money(owed) + '.</div></div>';
}

/* ============================================================
   Exports — CSV, a multi-sheet workbook, and a JSON backup.
   ============================================================ */
function download(filename, text, mime) {
  const blob = new Blob([text], { type: (mime || "text/plain") + ";charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
const stamp = () => todayISO();
const slug = s => String(s || "bakery").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");

/** Every table, as [name, headers, rows] — shared by CSV and workbook export. */
function sheets() {
  return [
    ["Orders", ["Customer", "Product", "Qty", "Date needed", "Raised", "Status", "Total",
        "Deposit required", "Received", "Outstanding", "Cost of goods", "Notes"],
      db.orders.map(o => [customerName(o.customerId), productName(o.productId), num(o.qty) || 1, o.date,
        o.createdAt || o.date, STATUS_LABEL[o.status], num(o.total), num(o.depositRequired),
        receivedOf(o), outstandingOf(o), orderCost(o), o.notes || ""])],
    ["Customers", ["Name", "Email", "Phone", "Orders", "Lifetime spend", "Status", "Notes"],
      db.customers.map(c => {
        const list = db.orders.filter(o => o.customerId === c.id);
        return [c.name, c.email || "", c.phone || "", list.length,
          round2(sum(list, receivedOf)), c.archived ? "Archived" : "Active", c.notes || ""];
      })],
    ["Products", ["Product", "Category", "Ingredients", "Labour", "Overhead", "Unit cost", "Margin %", "Price", "Profit", "Allergens", "Status"],
      db.products.map(p => { const c = costing(p);
        return [p.name, p.category || "", round2(c.ing), num(p.labour), num(p.overhead), round2(c.cost),
          num(p.margin), round2(c.price), round2(c.profit), (p.allergens || []).join(", "),
          p.archived ? "Archived" : "Active"]; })],
    ["Recipes", ["Product", "Ingredient", "Qty", "Unit", "Cost per unit", "Line cost"],
      db.products.flatMap(p => recipeLines(p).map(r =>
        [p.name, r.ingredient.name, r.qty, r.ingredient.unit, num(r.ingredient.cost), +(r.qty * num(r.ingredient.cost)).toFixed(2)]))],
    ["Shopping list", ["Ingredient", "In stock", "Reorder at", "Suggested buy", "Unit", "Estimated cost"],
      lowStock().map(i => { const buy = Math.max(1, Math.ceil(num(i.reorder) * 2 - num(i.stock)));
        return [i.name, num(i.stock), num(i.reorder), buy, i.unit, +(buy * num(i.cost)).toFixed(2)]; })],
    ["Alerts", ["Level", "Detail"], alerts().map(a => [a.level === "critical" ? "Critical" : "Soon", a.text])],
    ["Inventory", ["Ingredient", "Unit", "In stock", "Reorder at", "Cost per unit", "Stock value", "Expiry", "Status"],
      db.ingredients.map(i => [i.name, i.unit, num(i.stock), num(i.reorder), num(i.cost),
        +(num(i.stock) * num(i.cost)).toFixed(2), i.expiry || "", ingredientStatus(i).label])],
    ["Allergen matrix", ["Product"].concat(ALLERGENS),
      db.products.map(p => [p.name].concat(ALLERGENS.map(a => ((p.allergens || []).includes(a) ? "YES" : ""))))],
    ["Expenses", ["Category", "Date", "Amount", "Notes"],
      db.expenses.map(e => [e.category, e.date, num(e.amount), e.notes || ""])],
    ["Payments", ["Customer", "Order date", "Payment date", "Amount", "Note", "Order total", "Received to date", "Outstanding"],
      db.orders.flatMap(o => paymentsOf(o).map(pay =>
        [customerName(o.customerId), o.date, pay.date, num(pay.amount), pay.note || "",
          num(o.total), receivedOf(o), outstandingOf(o)]))],
    ["Profit and loss", ["Month", "Orders", "Booked sales", "Cost of goods", "Expenses", "Net profit", "Cash received", "Outstanding"],
      lastMonths(12).map(m => [m.label + " " + m.year, m.count, m.bookedSales, m.cogs, m.expenses, m.profit, m.cashReceived, m.outstanding])],
    ["Bake log", ["Product", "Batches", "Date", "Ingredients deducted", "Notes"],
      db.bakes.map(b => [productName(b.productId), num(b.qty) || 1, b.date,
        (b.deductions || []).map(x => {
          const i = byId(db.ingredients, x.ingredientId);
          return (i ? i.name : "removed ingredient") + " " + num(x.qty) + (i ? " " + i.unit : "");
        }).join("; "), b.notes || ""])],
    ["Waste", ["Item", "Qty", "Reason", "Cost", "Date"],
      db.waste.map(w => [w.item, w.qty || "", w.reason || "", num(w.cost), w.date])],
    ["Tasks", ["Task", "Due", "Done"], db.tasks.map(t => [t.text, t.due || "", t.done ? "Yes" : "No"])],
    ["Social", ["Caption", "Channel", "Date", "Posted"], db.social.map(s => [s.caption, s.channel || "", s.date, s.done ? "Yes" : "No"])],
    ["Settings", ["Setting", "Value"], Object.entries(db.settings).map(([k, v]) => [k, String(v)])]
  ];
}

const csvCell = v => { const s = String(v == null ? "" : v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
function toCsv(headers, rows) {
  return [headers].concat(rows).map(r => r.map(csvCell).join(",")).join("\r\n");
}

/** SpreadsheetML 2003 — a real multi-sheet workbook Excel, Numbers and
    LibreOffice all open, built without any external library. */
function toWorkbook() {
  const cell = v => {
    const isNum = typeof v === "number" && Number.isFinite(v);
    return '<Cell><Data ss:Type="' + (isNum ? "Number" : "String") + '">' + esc(isNum ? v : String(v == null ? "" : v)) + "</Data></Cell>";
  };
  const sheetXml = ([name, headers, rows]) =>
    '<Worksheet ss:Name="' + esc(name).slice(0, 31) + '"><Table>' +
      "<Row>" + headers.map(h => '<Cell ss:StyleID="h"><Data ss:Type="String">' + esc(h) + "</Data></Cell>").join("") + "</Row>" +
      rows.map(r => "<Row>" + r.map(cell).join("") + "</Row>").join("") +
    "</Table></Worksheet>";
  return '<?xml version="1.0"?><?mso-application progid="Excel.Sheet"?>' +
    '<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">' +
    '<Styles><Style ss:ID="h"><Font ss:Bold="1"/><Interior ss:Color="#E8DED0" ss:Pattern="Solid"/></Style></Styles>' +
    sheets().map(sheetXml).join("") + "</Workbook>";
}
