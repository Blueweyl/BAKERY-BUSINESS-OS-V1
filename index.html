<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bakery Business OS</title>
<meta name="description" content="Run your whole bakery from one file. Offline, no login, no subscription.">
<meta name="theme-color" content="#2D2118">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23C4713A'/%3E%3Ctext x='16' y='23' font-family='sans-serif' font-size='20' font-weight='700' fill='%23FAF7F2' text-anchor='middle'%3EB%3C/text%3E%3C/svg%3E">
<style>
/* ---------- design tokens ---------- */
:root{
  --ink:#2D2118; --bg:#FAF7F2; --card:#ffffff; --line:#E8DED0; --canvas:#EDE6DA;
  --accent:#C4713A; --accent-dark:#A85D2E; --green:#3F8A5C; --amber:#C08A1E; --red:#C0483F;
  /* Alphas chosen so every muted tone clears 4.5:1 on both surfaces. */
  --ink-60:rgba(45,33,24,.72); --ink-45:rgba(45,33,24,.66); --ink-75:rgba(45,33,24,.82);
  --radius:14px; --radius-sm:8px; --shadow:0 1px 2px rgba(45,33,24,.04);
  --font:"Poppins",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --sidebar:230px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font);
  font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased;
}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
a{color:var(--accent)}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.01em}

/* ---------- layout ---------- */
.app{display:flex;min-height:100vh}
.sidebar{
  width:var(--sidebar);flex:none;background:var(--ink);display:flex;flex-direction:column;
  padding:22px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;z-index:40;
}
.brand{display:flex;align-items:center;gap:12px;padding:0 10px 22px}
.brand-mark{width:32px;height:32px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center;flex:none;color:var(--bg);font-weight:700;font-size:16px}
.brand-text{color:var(--bg);font-weight:600;font-size:15px;letter-spacing:.03em;line-height:1.2}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-item{
  display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:9px;cursor:pointer;
  background:none;border:none;width:100%;text-align:left;font-family:inherit;font-size:14.5px;
  color:rgba(250,247,242,.62);font-weight:500;transition:background .12s,color .12s;
}
.nav-item:hover{background:rgba(250,247,242,.07);color:rgba(250,247,242,.9)}
.nav-item .label-short{display:none}
.nav-item .dot{width:8px;height:8px;border-radius:50%;background:rgba(250,247,242,.25);flex:none;transition:background .12s}
.nav-item[aria-current="page"]{background:rgba(196,113,58,.18);color:#FAF7F2;font-weight:600}
.nav-item[aria-current="page"] .dot{background:var(--accent)}
.nav-badge{margin-left:auto;background:var(--red);color:#fff;font-size:11px;font-weight:700;border-radius:20px;padding:1px 7px;min-width:20px;text-align:center}
.sidebar-foot{color:rgba(250,247,242,.35);font-size:12px;padding:12px 10px}
.spacer{flex:1}

.main{flex:1;min-width:0;padding:36px 40px 64px;max-width:1440px}
.page-title{font-size:30px;margin-bottom:4px}
.page-sub{margin:0 0 26px;color:var(--ink-60);font-size:15px}

/* ---------- cards & grid ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;box-shadow:var(--shadow)}
.card.dark{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.card-title{font-weight:600;font-size:16px;margin-bottom:14px}
.grid{display:grid;gap:18px}
/* Grid and flex children default to min-width:auto, which stops an
   overflow-x:auto table inside them from ever scrolling — it stretches the
   page instead. */
.grid > *,.stack > *,.main > *{min-width:0}
.grid.kpis{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.grid.two{grid-template-columns:1fr 1fr}
.grid.wide-narrow{grid-template-columns:1.4fr 1fr}
.stack{display:flex;flex-direction:column;gap:18px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0;max-width:100%}
.row.between{justify-content:space-between}
.mb{margin-bottom:20px}

.kpi-label{color:var(--ink-60);font-size:14px;font-weight:500}
.kpi-value{font-size:32px;font-weight:700;margin-top:6px;line-height:1.1}
.kpi-sub{font-size:13.5px;font-weight:600;margin-top:4px}
.kpi-sub.up{color:var(--green)} .kpi-sub.down{color:var(--red)} .kpi-sub.flat{color:var(--ink-45)}

/* ---------- controls ---------- */
input,select,textarea{
  border:1px solid var(--line);border-radius:var(--radius-sm);padding:9px 12px;font-size:14px;
  font-family:inherit;color:var(--ink);background:#fff;width:100%;
}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(196,113,58,.35);outline-offset:1px;border-color:var(--accent)}
label.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink-60);font-weight:500}
.btn{
  background:var(--accent);color:#fff;border:1px solid var(--accent);border-radius:var(--radius-sm);
  padding:9px 18px;font-weight:600;font-size:14px;cursor:pointer;font-family:inherit;white-space:nowrap;
}
.btn:hover{background:var(--accent-dark);border-color:var(--accent-dark)}
.btn.ghost{background:none;color:var(--accent)}
.btn.ghost:hover{background:rgba(196,113,58,.08);color:var(--accent-dark)}
.btn.neutral{background:none;color:var(--ink);border-color:var(--line)}
.btn.neutral:hover{background:var(--bg)}
.btn.danger{background:none;color:var(--red);border-color:rgba(192,72,63,.4)}
.btn.danger:hover{background:rgba(192,72,63,.08)}
.btn.sm{padding:6px 11px;font-size:12.5px;min-height:26px}
.btn.block{width:100%;text-align:center}
.icon-btn{background:none;border:none;color:var(--red);opacity:.55;cursor:pointer;font-size:14px;padding:5px 6px;line-height:1;font-family:inherit;min-width:24px;min-height:24px}
.icon-btn:hover{opacity:1}
.form-grid{display:grid;gap:10px;align-items:end}

/* ---------- tables ---------- */
.table-wrap{overflow-x:auto}
.thead,.trow{display:grid;align-items:center;gap:8px}
.thead{color:var(--ink-45);font-size:12.5px;font-weight:600;letter-spacing:.03em;padding:0 6px 10px;border-bottom:1px solid var(--line);text-transform:uppercase}
.trow{padding:13px 6px;border-bottom:1px solid var(--line);font-size:14.5px}
.trow:last-child{border-bottom:none}
.trow.clickable{cursor:pointer}
.trow.clickable:hover{background:var(--bg)}
.muted{color:var(--ink-60);font-size:14px}
.strong{font-weight:600}
.num{font-variant-numeric:tabular-nums}
.empty{padding:26px 6px;color:var(--ink-45);font-size:14px;text-align:center}

.pill{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:12.5px;padding:4px 11px;border-radius:20px;white-space:nowrap}
.pill.green{background:rgba(63,138,92,.12);color:var(--green)}
.pill.amber{background:rgba(192,138,30,.14);color:var(--amber)}
.pill.red{background:rgba(192,72,63,.12);color:var(--red)}
.pill.accent{background:rgba(196,113,58,.12);color:var(--accent)}
.pill.grey{background:rgba(45,33,24,.07);color:var(--ink-60)}

/* ---------- charts ---------- */
.bars{display:flex;align-items:flex-end;gap:24px;height:200px;min-width:0}
.bar-col{display:flex;flex-direction:column;align-items:center;gap:10px;flex:1 1 0;min-width:0;height:100%;justify-content:flex-end}
.bar-pair{display:flex;align-items:flex-end;gap:6px;flex:1;width:100%;min-width:0;justify-content:center}
/* Bars flex down rather than forcing the chart wider than the phone. */
.bar{flex:1 1 0;min-width:7px;max-width:44px;background:var(--accent);border-radius:6px 6px 0 0;min-height:2px;transition:height .3s}
.bar.ink{background:var(--ink)}
.bar.green{background:var(--green)}
.bar-label{font-size:13px;color:var(--ink-60);text-align:center}
.bar-cap{font-size:12px;font-weight:600;color:var(--ink-60)}
.progress{background:var(--line);border-radius:20px;height:12px;overflow:hidden}
.progress > div{height:100%;background:var(--accent);border-radius:20px;transition:width .3s}
.legend{display:flex;gap:18px;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-60)}
.swatch{width:12px;height:12px;border-radius:3px;background:var(--accent)}
.swatch.ink{background:var(--ink)}
.swatch.green{background:var(--green)}

/* ---------- alerts ---------- */
.alert{display:flex;align-items:center;gap:10px;border-radius:var(--radius-sm);padding:10px 14px;font-size:14.5px}
.alert .dot{width:8px;height:8px;border-radius:50%;flex:none}
.alert.red{background:rgba(192,72,63,.08)} .alert.red .dot{background:var(--red)}
.alert.amber{background:rgba(192,138,30,.08)} .alert.amber .dot{background:var(--amber)}
.alert.green{background:rgba(63,138,92,.1)} .alert.green .dot{background:var(--green)}

/* ---------- calendar ---------- */
.cal-head{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}
.cal-head span{text-align:center;font-size:12px;font-weight:600;color:var(--ink-45)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:minmax(92px,auto);gap:6px}
.cal-day{border:1px solid var(--line);border-radius:var(--radius-sm);padding:6px;background:var(--card);min-width:0;overflow:hidden}
.cal-day.out{background:transparent;border-color:transparent}
.cal-day.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cal-day.busy{background:rgba(196,113,58,.06)}
.cal-num{font-size:12px;color:var(--ink-45)}
.cal-chip{margin-top:3px;background:var(--accent);border-radius:4px;padding:2px 6px;color:#fff;font-size:10.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.cal-chip.paid{background:var(--green)} .cal-chip.quoted{background:var(--amber)} .cal-chip.enquiry{background:rgba(45,33,24,.55)}

/* ---------- kanban ---------- */
.kanban{display:grid;grid-template-columns:repeat(4,minmax(215px,1fr));gap:16px}
.kan-col{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;min-height:120px;max-height:460px;overflow-y:auto}
.kan-col.drag-over{border-color:var(--accent);background:rgba(196,113,58,.05)}
.kan-head{font-weight:600;font-size:14.5px;margin-bottom:10px;display:flex;justify-content:space-between}
.kan-head .count{color:var(--ink-45)}
.kan-card{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:11px 12px;margin-bottom:8px;cursor:grab}
.kan-card:active{cursor:grabbing}
.kan-card .name{font-weight:600;font-size:13.5px}
.kan-card .detail{color:var(--ink-60);font-size:12.5px;margin-top:2px}
.kan-card .bal{font-size:12px;font-weight:700;margin-top:4px}

/* ---------- modal ---------- */
.modal-back{position:fixed;inset:0;background:rgba(45,33,24,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:100}
.modal{background:var(--card);border-radius:var(--radius);max-width:600px;width:100%;max-height:88vh;overflow-y:auto;padding:26px 28px;box-shadow:0 40px 80px -20px rgba(45,33,24,.4)}
.modal h2{font-size:21px;margin-bottom:4px}
.modal .sub{color:var(--ink-60);font-size:14px;margin:0 0 20px}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:22px;flex-wrap:wrap}
.toast{position:fixed;bottom:24px;max-width:calc(100% - 32px);text-align:center;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 22px;border-radius:24px;font-size:14px;font-weight:500;z-index:200;box-shadow:0 12px 30px -8px rgba(45,33,24,.5)}

.checkbox{display:flex;align-items:center;gap:7px;font-size:13.5px;cursor:pointer;color:var(--ink);font-weight:500}
.checkbox input{width:auto}
.check{width:24px;height:24px;border-radius:6px;border:2px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;flex:none;cursor:pointer;color:#fff;font-size:12px;font-weight:800}
.check.on{background:var(--green);border-color:var(--green)}
.done{opacity:.45;text-decoration:line-through}
.formula{background:var(--ink);border-radius:12px;padding:14px 20px;color:var(--bg);font-family:Georgia,"Times New Roman",serif;font-size:15px;opacity:.95}
.label-card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:16px 18px}
.label-card .contains{border-top:1px solid var(--line);padding-top:10px;margin-top:10px;color:var(--red);font-weight:700;font-size:12px;letter-spacing:.03em}
.hint{color:var(--ink-45);font-size:12.5px}
.seg{display:inline-flex;max-width:100%;overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius-sm);background:#fff}
.seg button{flex:none}
.row > .seg{min-width:0}
.seg button{background:none;border:none;padding:7px 14px;font-family:inherit;font-size:13.5px;cursor:pointer;color:var(--ink-60);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff;font-weight:600}
.menu-toggle{display:none}

/* ---------- responsive ---------- */
@media (max-width:1080px){
  .grid.two,.grid.wide-narrow{grid-template-columns:1fr}
  .kanban{grid-template-columns:repeat(4,minmax(200px,1fr));overflow-x:auto;padding-bottom:6px}
}
@media (max-width:860px){
  :root{--sidebar:72px}
  .brand-text,.nav-item .label,.sidebar-foot{display:none}
  .nav-item{justify-content:center;padding:13px 8px}
  .nav-badge{position:absolute;margin:0;transform:translate(14px,-12px)}
  .nav-item{position:relative}
  .main{padding:24px 18px 60px}
  .page-title{font-size:25px}
  .form-grid{grid-template-columns:1fr !important}
  .thead,.trow{min-width:560px}
  .cal-grid{grid-auto-rows:minmax(74px,auto)}
}
/* Fingers need more than a 22px target. */
@media (pointer:coarse),(max-width:620px){
  .icon-btn{padding:10px;font-size:15px}
  .btn.sm{padding:9px 14px;font-size:13px}
  .check{width:26px;height:26px}
  .seg button{padding:10px 14px}
  .nav-item{min-height:44px}
}
@media (max-width:620px){
  .sidebar{
    position:fixed;bottom:0;top:auto;left:0;right:0;width:100%;height:auto;flex-direction:row;
    padding:6px 4px;overflow-x:auto;border-top:1px solid rgba(250,247,242,.12);
  }
  .brand,.spacer,.sidebar-foot{display:none}
  .nav{flex-direction:row;gap:0}
  .nav-item{flex-direction:column;gap:5px;padding:8px 5px;font-size:10px;min-width:60px}
  .nav-item .label{display:none}
  .nav-item .label-short{display:block;font-size:10px;text-align:center;line-height:1.1;white-space:nowrap}
  .app{flex-direction:column-reverse}
  .main{padding:20px 14px 96px;max-width:100%}
  .kanban{grid-template-columns:repeat(4,minmax(180px,1fr))}
  .cal-grid{gap:3px;grid-auto-rows:minmax(58px,auto)}
  .cal-chip{font-size:9px;padding:1px 4px}
  .bars{gap:8px}
  .bar-pair{gap:3px}
  .bar-label{font-size:11px}
  .modal{padding:20px 18px}
  .toast{bottom:92px}
  .row > input[data-change="searchOrders"]{width:100% !important}
}

/* ---------- print / PDF ---------- */
#print-root{display:none}
@media print{
  @page{size:A4;margin:16mm}
  body{background:#fff}
  .app,.modal-back,.toast{display:none !important}
  #print-root{display:block}
  .doc{page-break-after:always;color:#2D2118;font-family:var(--font)}
  .doc:last-child{page-break-after:auto}
}
.doc{max-width:720px;margin:0 auto 40px}
.doc-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid var(--accent);padding-bottom:16px;margin-bottom:24px}
.doc-kicker{color:var(--accent);font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase}
.doc h1{font-size:26px;margin-top:4px}
.doc-meta{text-align:right;font-size:13px;color:var(--ink-60);line-height:1.7}
.doc table{width:100%;border-collapse:collapse;margin:18px 0;font-size:14px}
.doc th{text-align:left;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-60);border-bottom:1px solid var(--line);padding:8px 4px}
.doc td{padding:11px 4px;border-bottom:1px solid var(--line)}
.doc td.r,.doc th.r{text-align:right}
.doc-total{display:flex;justify-content:space-between;padding:12px 4px;font-size:16px;font-weight:700;border-top:2px solid var(--ink)}
.doc-note{margin-top:26px;font-size:12.5px;color:var(--ink-60);line-height:1.7;border-top:1px solid var(--line);padding-top:14px}
</style>
</head>
<body>
<div id="app" class="app"></div>
<div id="overlay"></div>
<div id="print-root"></div>
<script>
"use strict";
/* ============================================================
   Bakery Business OS — single-file, offline, no dependencies.
   All data lives in localStorage on this device only.
   ============================================================ */

/* ---------- utilities ---------- */
const $ = (sel, root) => (root || document).querySelector(sel);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const clamp = (n, lo, hi) => Math.min(hi, Math.max(lo, n));
const num = v => { const n = parseFloat(v); return Number.isFinite(n) ? n : 0; };
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const DAY = 86400000;
const todayISO = () => new Date().toISOString().slice(0, 10);
const iso = d => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
const parseISO = s => { const [y, m, d] = String(s || "").split("-").map(Number); return new Date(y || 1970, (m || 1) - 1, d || 1); };
const shiftDays = n => iso(new Date(Date.now() + n * DAY));
const daysUntil = s => Math.round((parseISO(s) - parseISO(todayISO())) / DAY);
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fmtDate = s => { if (!s) return "—"; const d = parseISO(s); return MONTHS[d.getMonth()] + " " + d.getDate(); };
const fmtLongDate = s => { if (!s) return "—"; const d = parseISO(s); return MONTHS[d.getMonth()] + " " + d.getDate() + ", " + d.getFullYear(); };
const monthKey = s => String(s || "").slice(0, 7);
const sum = (arr, fn) => arr.reduce((a, x) => a + (fn ? fn(x) : x), 0);

/* ---------- state ---------- */
const STORE_KEY = "bakery-business-os/v1";
const SCHEMA = 2;
const ALLERGENS = ["Gluten", "Egg", "Dairy", "Nuts", "Soy"];
const STATUSES = ["enquiry", "quoted", "booked", "paid"];
const STATUS_LABEL = { enquiry: "Enquiry", quoted: "Quoted", booked: "Booked", paid: "Paid" };
const STATUS_TONE = { enquiry: "grey", quoted: "amber", booked: "accent", paid: "green" };

let db = null;          // the whole business, persisted
let view = "dashboard"; // current module
let ui = {};            // transient view state (filters, expanded rows, drafts)

function seed() {
  const t = todayISO();
  const ing = (name, unit, stock, reorder, cost, expiry) =>
    ({ id: uid(), name, unit, stock, reorder, cost, expiry });
  const ingredients = [
    ing("Cake flour", "kg", 8, 4, 2.4, shiftDays(180)),
    ing("Unsalted butter", "kg", 2.4, 3, 9.5, shiftDays(26)),
    ing("Free-range eggs", "units", 6, 24, 0.42, shiftDays(11)),
    ing("Caster sugar", "kg", 5.5, 3, 1.9, shiftDays(300)),
    ing("Vanilla extract", "ml", 90, 150, 0.12, shiftDays(400)),
    ing("Cream cheese", "kg", 1.1, 1.5, 11.2, shiftDays(5)),
    ing("Cocoa powder", "kg", 1.8, 1, 14.0, shiftDays(220)),
    ing("Ground almonds", "kg", 0.9, 1, 16.5, shiftDays(60))
  ];
  const iId = n => ingredients.find(i => i.name === n).id;
  /** recipe: what one batch consumes, in each ingredient's own unit. */
  const recipe = pairs => pairs.map(([name, qty]) => ({ ingredientId: iId(name), qty }));
  const prod = (name, recipeLines, labour, overhead, margin, allergens, category) =>
    ({ id: uid(), name, recipe: recipe(recipeLines), ingCost: 0, labour, overhead, margin, allergens, category, archived: false });

  const products = [
    prod("Classic Vanilla Cake",
      [["Cake flour", 0.9], ["Unsalted butter", 0.45], ["Free-range eggs", 8], ["Caster sugar", 0.6], ["Vanilla extract", 30]],
      18, 4.1, 45, ["Gluten", "Egg", "Dairy"], "Custom cakes"),
    prod("Choc Fudge Cake",
      [["Cake flour", 0.8], ["Unsalted butter", 0.5], ["Free-range eggs", 8], ["Caster sugar", 0.7], ["Cocoa powder", 0.25], ["Ground almonds", 0.1]],
      20, 4.4, 45, ["Gluten", "Egg", "Dairy", "Nuts"], "Custom cakes"),
    prod("Red Velvet Cake",
      [["Cake flour", 0.85], ["Unsalted butter", 0.4], ["Free-range eggs", 6], ["Caster sugar", 0.65], ["Cocoa powder", 0.06], ["Cream cheese", 0.4]],

const RESCUE_KEY = STORE_KEY + "/unreadable";
/** Set when saved data could not be read, so the app can say so instead of
    quietly handing the user a sample bakery in place of their records. */
let loadFailure = null;

function load() {
  let raw = null;
  try { raw = localStorage.getItem(STORE_KEY); }
  catch (e) { loadFailure = "This browser is blocking local storage, so nothing can be saved."; return seed(); }
  if (!raw) return seed();
  let parsed = null;
  try { parsed = JSON.parse(raw); } catch (e) { parsed = null; }
  if (parsed && typeof parsed === "object" && !Array.isArray(parsed) &&
      (parsed.schema || Array.isArray(parsed.orders))) {
    try { return migrate(parsed); }
    catch (e) { console.error("Saved data could not be upgraded:", e); }
  }
  // Keep the unreadable text so it can still be downloaded and inspected —
  // never overwrite it with a fresh book.
  try { localStorage.setItem(RESCUE_KEY, raw); } catch (e) { /* nothing more we can do */ }
  loadFailure = "Your saved data could not be read, so the sample bakery is showing instead. " +
    "The unreadable file has been kept — download it from Settings before entering new data.";
  return seed();
}

function downloadRescue() {
  let raw = null;
  try { raw = localStorage.getItem(RESCUE_KEY); } catch (e) { /* ignore */ }
  if (!raw) return toast("There is no unreadable file kept on this device.");
  download("bakery-unreadable-data-" + stamp() + ".txt", raw, "text/plain");
}

const LISTS = ["customers", "products", "ingredients", "orders", "expenses", "tasks", "bakes", "waste", "social"];

/** Brings any earlier save or backup up to the current shape without
    discarding records. Runs on load and on every import. */
function migrate(data) {
  const base = seed();
  for (const key of Object.keys(base)) if (!(key in data)) data[key] = Array.isArray(base[key]) ? [] : base[key];
  for (const key of LISTS) if (!Array.isArray(data[key])) data[key] = [];
  data.settings = Object.assign({}, base.settings, data.settings || {});
  data.meta = Object.assign({}, base.meta, data.meta || {});

  // Every record needs an id; anything without one would be undeletable.
  for (const key of LISTS) for (const row of data[key]) if (row && !row.id) row.id = uid();

  if (num(data.schema) < 2) {
    // v1 stored a single `deposit` number, which booking filled in
    // automatically. That number was labelled "deposit paid", so treat it as
    // cash actually received and turn it into a payment record.
    for (const o of data.orders) {
      if (!Array.isArray(o.payments)) {
        const paidAmount = o.status === "paid" ? num(o.total) : num(o.deposit);
        o.payments = paidAmount > 0
          ? [{ id: uid(), amount: round2(paidAmount), date: o.date || todayISO(), note: "Imported from earlier version" }]
          : [];
      }
      if (o.depositRequired === undefined) {
        o.depositRequired = ["booked", "quoted", "paid"].includes(o.status)
          ? round2(num(o.total) * num(data.settings.depositPct) / 100) : 0;
      }
      delete o.deposit;
    }
  }

  // Shared repairs, applied whatever the version — an edited or truncated
  // backup should load as far as it sensibly can rather than be rejected.
  for (const o of data.orders) {
    if (!Array.isArray(o.payments)) o.payments = [];
    o.payments = o.payments.filter(pay => pay && num(pay.amount) > 0)
      .map(pay => ({ id: pay.id || uid(), amount: round2(pay.amount), date: pay.date || o.date || todayISO(), note: pay.note || "" }));
    o.total = round2(o.total);
    o.qty = Math.max(1, parseInt(o.qty, 10) || 1);
    o.depositRequired = clamp(round2(o.depositRequired), 0, num(o.total));
    o.createdAt = o.createdAt || o.date || todayISO();
    if (!STATUSES.includes(o.status)) o.status = "enquiry";
    if (o.costSnapshot && !num(o.costSnapshot.unit)) o.costSnapshot = null;
  }
  for (const b of data.bakes) if (!Array.isArray(b.deductions)) b.deductions = [];
  for (const i of data.ingredients) {
    i.stock = round2(Math.max(0, num(i.stock)));
    i.reorder = round2(Math.max(0, num(i.reorder)));
    i.cost = round2(Math.max(0, num(i.cost)));
  }
  for (const e of data.expenses) e.amount = round2(Math.max(0, num(e.amount)));
  for (const w of data.waste) w.cost = round2(Math.max(0, num(w.cost)));
  for (const p of data.products) {
    if (!Array.isArray(p.recipe)) p.recipe = [];
    p.recipe = p.recipe.filter(l => l && l.ingredientId && num(l.qty) > 0);
    if (!Array.isArray(p.allergens)) p.allergens = [];
  }
  data.schema = SCHEMA;
  return data;
}

/** Reports what is wrong with a candidate backup, or [] if it will load. */
function backupProblems(parsed) {
  const bad = [];
  if (!parsed || typeof parsed !== "object" || Array.isArray(parsed)) return ["That file is not a backup."];
  if (!parsed.schema && !parsed.orders && !parsed.customers) return ["That file is not a Bakery Business OS backup."];
  if (num(parsed.schema) > SCHEMA) bad.push("It was made by a newer version of the app (file " + parsed.schema + ", this app " + SCHEMA + ").");
  for (const key of LISTS) if (parsed[key] !== undefined && !Array.isArray(parsed[key])) bad.push('The "' + key + '" section is damaged.');
  if (parsed.settings !== undefined && (typeof parsed.settings !== "object" || Array.isArray(parsed.settings))) bad.push("The settings section is damaged.");
  return bad;
}

let saveTimer = null;
function writeNow() {
  clearTimeout(saveTimer);
  saveTimer = null;
  try { localStorage.setItem(STORE_KEY, JSON.stringify(db)); }
  catch (e) { toast("Could not save — device storage may be full."); console.error(e); }
}
/** Writes are debounced so fast typing doesn't thrash storage, then
    flushed the moment the page is hidden or closed. */
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(writeNow, 120);
}
window.addEventListener("pagehide", () => { if (saveTimer) writeNow(); });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden" && saveTimer) writeNow(); });

/** Mutate state, persist, re-render. */
function commit(fn, message) {
  fn();
  db.meta.sample = false;
  save();
  render();
  if (message) toast(message);
}

/* ---------- money ---------- */
const cur = () => (db && db.settings.currency) || "$";
function money(n, opts) {
  const v = num(n) === 0 ? 0 : num(n);   // num() drops NaN and Infinity
  const compact = opts && opts.compact && Math.abs(v) >= 10000;
  const body = compact
    ? (v / 1000).toFixed(1).replace(/\.0$/, "") + "k"
    : v.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  return (v < 0 ? "-" : "") + cur() + body.replace(/^-/, "");
}
const money0 = n => cur() + (Math.round(num(n)) + 0).toLocaleString();   // + 0 normalises -0

/* ---------- derived business logic ---------- */
const byId = (list, id) => (list || []).find(x => x.id === id);
/** Case-insensitive name match, used to stop accidental duplicates. */
const sameName = (list, name, skipId) => (list || []).some(x =>
  x.id !== skipId && String(x.name || "").trim().toLowerCase() === String(name || "").trim().toLowerCase());
const customerById = id => db.customers.find(c => c.id === id);
const productById = id => db.products.find(p => p.id === id);
const customerName = id => (customerById(id) || {}).name || "—";
const productName = id => (productById(id) || {}).name || "—";

/** What one batch of a product's recipe costs, priced from live
    inventory. Products without a recipe keep their flat figure. */
function recipeCost(p) {
  if (!p.recipe || !p.recipe.length) return null;
  return sum(p.recipe, line => {
    const i = byId(db.ingredients, line.ingredientId);
    return i ? num(line.qty) * num(i.cost) : 0;
  });
}
/** Ingredients that one batch consumes, resolved against inventory. */
function recipeLines(p) {
  return (p.recipe || []).map(line => ({
    line, ingredient: byId(db.ingredients, line.ingredientId), qty: num(line.qty)
  })).filter(r => r.ingredient);
}
/** Unit cost and suggested price for a product, from the pricing formula. */
function costing(p) {
  const fromRecipe = recipeCost(p);
  const ing = fromRecipe === null ? num(p.ingCost) : fromRecipe;
  const cost = ing + num(p.labour) + num(p.overhead);
  const margin = clamp(num(p.margin), 0, 95);
  const price = cost / (1 - margin / 100);
  return { cost, ing, price, profit: price - cost, fromRecipe: fromRecipe !== null,
    marginPct: price > 0 ? ((price - cost) / price) * 100 : 0 };
}

/* ---------- the money model ----------
   An order's agreed price is `total`. `depositRequired` is what the customer
   was ASKED for up front — a request, not cash. Cash exists only as entries
   in `payments`, so booking an order can never invent money that nobody paid.
   Every figure below derives from those three facts, so Orders, Dashboard,
   invoices, exports and the P&L cannot disagree with each other.           */
const round2 = n => Math.round((Number(n) || 0) * 100) / 100;
const paymentsOf = o => (o.payments || []);
/** Cash actually collected against this order. */
const receivedOf = o => round2(sum(paymentsOf(o), pay => num(pay.amount)));
/** Still to collect on the agreed price. */
const balanceOf = o => round2(Math.max(0, num(o.total) - receivedOf(o)));
/** Deposit asked for but not yet covered by payments. */
const depositDue = o => round2(Math.max(0, num(o.depositRequired) - receivedOf(o)));
/** Committed = the customer has agreed and the sale is on the books.
    An enquiry or an open quote is not a sale and is never a debt. */
const isCommitted = o => o.status === "booked" || o.status === "paid";
const outstandingOf = o => (isCommitted(o) ? balanceOf(o) : 0);
const isFullyPaid = o => receivedOf(o) >= num(o.total) - 0.005;
/** Cash taken beyond the agreed price — usually a double-entered payment. */
const overpaidBy = o => round2(Math.max(0, receivedOf(o) - num(o.total)));
/** A quote expires a set number of days after it was raised — not on the
    date the cake is wanted, which may be months later. */
const quoteExpiry = o => iso(new Date(parseISO(o.createdAt || o.date).getTime() +
  Math.max(1, num(db.settings.quoteValidDays)) * DAY));
const quoteExpired = o => o.status === "quoted" && daysUntil(quoteExpiry(o)) < 0;

/** Cost of making one unit, frozen at the moment an order is committed, so
    later ingredient price rises cannot rewrite last quarter's profit. */
function snapshotCost(p) {
  const c = costing(p);
  return { ing: round2(c.ing), labour: round2(p.labour), overhead: round2(p.overhead),
    unit: round2(c.cost), productName: p.name, at: todayISO() };
}
/** Cost of goods for an order: the snapshot if it has one, else live cost. */
function orderCost(o) {
  const qty = num(o.qty) || 1;
  if (o.costSnapshot) return round2(num(o.costSnapshot.unit) * qty);
  const p = productById(o.productId);
  return p ? round2(costing(p).cost * qty) : 0;
}
/** Records cash against an order. The only way money enters the system. */
function addPayment(o, amount, date, note) {
  const amt = round2(amount);
  if (!(amt > 0)) return false;
  o.payments = paymentsOf(o).concat([{ id: uid(), amount: amt, date: date || todayISO(), note: note || "" }]);
  if (isFullyPaid(o) && o.status === "booked") o.status = "paid";
  return true;
}

function ingredientStatus(i) {
  const days = i.expiry ? daysUntil(i.expiry) : null;
  if (days !== null && days <= 0) return { key: "expired", label: "Expired", tone: "red" };
  if (days !== null && days <= 14) return { key: "expiring", label: "Expiring", tone: "red" };
  if (num(i.stock) <= 0) return { key: "out", label: "Out of stock", tone: "red" };
  if (num(i.stock) <= num(i.reorder)) return { key: "low", label: "Low", tone: "amber" };
  return { key: "good", label: "Good", tone: "green" };
}

const stockValue = () => sum(db.ingredients, i => num(i.stock) * num(i.cost));
const lowStock = () => db.ingredients.filter(i => ["low", "out"].includes(ingredientStatus(i).key));
const expiringSoon = () => db.ingredients.filter(i => ["expiring", "expired"].includes(ingredientStatus(i).key));

/** Revenue, expenses and profit for a given YYYY-MM. */
/** One month on two bases, kept deliberately separate:
    accrual (booked sales, cost of goods, expenses, profit) and cash
    (what was actually received in the month, and what is still owed). */
function monthStats(key) {
  const orders = db.orders.filter(o => monthKey(o.date) === key && isCommitted(o));
  const bookedSales = round2(sum(orders, o => num(o.total)));
  const cogs = round2(sum(orders, orderCost));
  const expenses = round2(sum(db.expenses.filter(e => monthKey(e.date) === key), e => num(e.amount)));
  const cashReceived = round2(sum(db.orders, o =>
    sum(paymentsOf(o).filter(pay => monthKey(pay.date) === key), pay => num(pay.amount))));
  return { key, bookedSales, cogs, expenses, cashReceived,
    outstanding: round2(sum(orders, outstandingOf)),
    profit: round2(bookedSales - cogs - expenses), count: orders.length };
}

function lastMonths(n) {
  const out = [];
  const d = new Date();
  d.setDate(1);
  for (let i = n - 1; i >= 0; i--) {
    const m = new Date(d.getFullYear(), d.getMonth() - i, 1);
    out.push(Object.assign(monthStats(iso(m).slice(0, 7)), { label: MONTHS[m.getMonth()], year: m.getFullYear() }));
  }
  return out;
}

/** Everything the dashboard needs to shout about. */
function alerts() {
  const out = [];
  for (const i of expiringSoon()) {
    const d = daysUntil(i.expiry);
    out.push({ level: "critical", text: d <= 0 ? i.name + " expired " + Math.abs(d) + " day" + (Math.abs(d) === 1 ? "" : "s") + " ago" : i.name + " expires in " + d + " day" + (d === 1 ? "" : "s") });
  }
  for (const o of db.orders) {
    if (o.status === "booked" && daysUntil(o.date) < 0 && balanceOf(o) > 0)
      out.push({ level: "critical", text: customerName(o.customerId) + " — " + money(balanceOf(o)) + " balance overdue" });
    if (o.status === "booked" && depositDue(o) > 0 && daysUntil(o.date) <= 7)
      out.push({ level: "soon", text: customerName(o.customerId) + " — " + money(depositDue(o)) + " deposit not yet received" });
  }
  for (const i of lowStock()) {
    const s = ingredientStatus(i);
    out.push({ level: s.key === "out" ? "critical" : "soon", text: i.name + " — " + (s.key === "out" ? "out of stock" : num(i.stock) + " " + i.unit + " left (reorder at " + i.reorder + ")") });
  }
  for (const o of db.orders) {
    const d = daysUntil(o.date);
    if (o.status === "quoted") {
      const left = daysUntil(quoteExpiry(o));
      if (left < 0) out.push({ level: "critical", text: "Quote for " + customerName(o.customerId) + " expired " + Math.abs(left) + " day" + (Math.abs(left) === 1 ? "" : "s") + " ago" });
      else if (left <= 3) out.push({ level: "soon", text: "Quote for " + customerName(o.customerId) + " expires " + (left === 0 ? "today" : "in " + left + " day" + (left === 1 ? "" : "s")) });
      else if (d >= 0 && d <= 3) out.push({ level: "soon", text: "Quote for " + customerName(o.customerId) + " is unconfirmed — needed " + (d === 0 ? "today" : "in " + d + " day" + (d === 1 ? "" : "s")) });
    }
  }
  for (const t of db.tasks) {
    if (!t.done && t.due && daysUntil(t.due) < 0) out.push({ level: "soon", text: "Task overdue: " + t.text });
  }
  return out;
}
const ordersOn = dateISO => db.orders.filter(o => o.date === dateISO);
</script>
<script>
/* ============================================================
   Shell: navigation, rendering, forms, actions, dialogs.
   ============================================================ */
const NAV = [
  { id: "dashboard",  label: "Dashboard",           short: "Home" },
  { id: "calendar",   label: "Order calendar",      short: "Calendar" },
  { id: "orders",     label: "Enquiries & orders",  short: "Orders" },
  { id: "customers",  label: "Customers",           short: "People" },
  { id: "products",   label: "Products & costing",  short: "Products" },
  { id: "inventory",  label: "Inventory",           short: "Stock" },
  { id: "payments",   label: "Payments & P&L",      short: "Money" },
  { id: "kitchen",    label: "Tasks & bake log",    short: "Kitchen" },
  { id: "settings",   label: "Settings & backup",   short: "Setup" }
];

const VIEWS = {}; // populated below, one render function per module

function render() {
  const main = $("#app .main");
  const scroll = main ? main.scrollTop : 0;
  const badges = { orders: alerts().filter(a => a.level === "critical").length, inventory: lowStock().length + expiringSoon().length };
  $("#app").innerHTML =
    '<nav class="sidebar" aria-label="Modules">' +
      '<div class="brand"><div class="brand-mark">B</div><span class="brand-text">Bakery<br>Business OS</span></div>' +
      '<div class="nav">' + NAV.map(n =>
        '<button class="nav-item" data-act="go" data-view="' + n.id + '"' + (view === n.id ? ' aria-current="page"' : "") + '>' +
          '<span class="dot"></span><span class="label">' + esc(n.label) + '</span>' +
          '<span class="label-short">' + esc(n.short) + '</span>' +
          (badges[n.id] ? '<span class="nav-badge">' + badges[n.id] + '</span>' : "") +
        '</button>').join("") +
      '</div><div class="spacer"></div>' +
      '<div class="sidebar-foot">v1.0 · offline<br>' + esc(db.settings.bakeryName) + '</div>' +
    '</nav>' +
    '<main class="main" id="main" tabindex="-1">' + (VIEWS[view] || VIEWS.dashboard)() + '</main>';
  const m = $("#app .main");
  if (m && view === renderedView) m.scrollTop = scroll;
  renderedView = view;
}
let renderedView = view;

function go(next) {
  if (!VIEWS[next]) next = "dashboard";
  view = next;
  ui = {};
  location.hash = next;
  render();
  const m = $("#main");
  if (m) { m.scrollTop = 0; m.focus({ preventScroll: true }); }
}

/* ---------- toast & modal ---------- */
let toastTimer = null;
function toast(msg) {
  const old = $(".toast"); if (old) old.remove();
  const el = document.createElement("div");
  el.className = "toast";
  el.setAttribute("role", "status");
  el.textContent = msg;
  document.body.appendChild(el);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.remove(), 2600);
}

function closeModal() { $("#overlay").innerHTML = ""; }

/** Show a modal. body is HTML; actions is [{label, act, cls}]. */
function modal(title, sub, body, actions) {
  $("#overlay").innerHTML =
    '<div class="modal-back" data-act="closeModalBack"><div class="modal" role="dialog" aria-modal="true" aria-label="' + esc(title) + '">' +
      '<h2>' + esc(title) + '</h2>' + (sub ? '<p class="sub">' + esc(sub) + '</p>' : '<div style="height:14px"></div>') +
      body +
      '<div class="modal-actions">' +
        (actions || []).map(a => '<button class="btn ' + (a.cls || "neutral") + '" data-act="' + a.act + '"' + (a.data || "") + '>' + esc(a.label) + '</button>').join("") +
      '</div>' +
    '</div></div>';
  const first = $("#overlay input, #overlay select, #overlay textarea, #overlay button");
  if (first) first.focus();
}

function confirmDo(title, message, label, fn) {
  pendingConfirm = fn;
  modal(title, message, "", [
    { label: "Cancel", act: "closeModal" },
    { label: label, act: "confirmYes", cls: "danger" }
  ]);
}
let pendingConfirm = null;
/** Holds the data a restore replaced, so it can be put back. */
let undoSnapshot = null;

/* ---------- forms ---------- */
/** The [data-form] block `el` belongs to. Buttons in a dialog's action
    bar sit outside the form, so fall back to the form in that dialog. */
function formOf(el) {
  return el.closest("[data-form]") ||
    (el.closest(".modal") || document).querySelector("[data-form]");
}
/** Collect values from the form block `el` belongs to. */
function readForm(el) {
  const form = formOf(el);
  const out = {};
  if (!form) return out;
  form.querySelectorAll("[data-f]").forEach(f => {
    if (f.type === "checkbox") {
      if (f.dataset.group) { (out[f.dataset.group] = out[f.dataset.group] || []); if (f.checked) out[f.dataset.group].push(f.dataset.f); }
      else out[f.dataset.f] = f.checked;
    } else out[f.dataset.f] = f.value;
  });
  return out;
}
function clearForm(el) {
  const form = formOf(el);
  if (!form) return;
  form.querySelectorAll("[data-f]").forEach(f => {
    if (f.type === "checkbox") f.checked = false;
    else if (f.dataset.keep === undefined) f.value = f.dataset.default || "";
  });
}
const field = (label, inner) => '<label class="field">' + esc(label) + inner + '</label>';
const input = (name, attrs) => '<input data-f="' + name + '" ' + (attrs || "") + '>';
const selectOf = (name, options, selected, placeholder) =>
  '<select data-f="' + name + '">' +
    (placeholder ? '<option value="">' + esc(placeholder) + '</option>' : "") +
    options.map(o => '<option value="' + esc(o.value) + '"' + (o.value === selected ? " selected" : "") + '>' + esc(o.label) + '</option>').join("") +
  '</select>';
/** Pickers hide archived records, except the one already chosen — so an
    order that refers to an archived product still shows it correctly. */
const customerOptions = keep => db.customers
  .filter(c => !c.archived || c.id === keep).slice()
  .sort((a, b) => a.name.localeCompare(b.name))
  .map(c => ({ value: c.id, label: c.name + (c.archived ? " (archived)" : "") }));
const productOptions = keep => db.products
  .filter(p => !p.archived || p.id === keep)
  .map(p => ({ value: p.id, label: p.name + (p.archived ? " (archived)" : "") }));

/* ---------- shared view pieces ---------- */
const header = (title, sub) => '<h1 class="page-title">' + esc(title) + '</h1><p class="page-sub">' + esc(sub) + '</p>';
const card = (title, body, cls) => '<section class="card ' + (cls || "") + '">' + (title ? '<div class="card-title">' + esc(title) + '</div>' : "") + body + '</section>';
const emptyRow = msg => '<div class="empty">' + esc(msg) + '</div>';
const pill = (label, tone) => '<span class="pill ' + tone + '">' + esc(label) + '</span>';
const delBtn = (act, id, label) => '<button class="icon-btn" data-act="' + act + '" data-id="' + id + '" title="' + esc(label || "Delete") + '" aria-label="' + esc(label || "Delete") + '">&#10005;</button>';

/** A bar chart column set. rows: [{label, values:[{v, cls}]}] scaled to max. */
function barChart(rows, height) {
  const h = height || 190;
  const max = Math.max(1, ...rows.flatMap(r => r.values.map(v => v.v)));
  return '<div class="bars" style="height:' + (h + 30) + 'px">' + rows.map(r =>
    '<div class="bar-col">' +
      '<div class="bar-pair" style="height:' + h + 'px">' +
        r.values.map(v => '<div class="bar ' + (v.cls || "") + '" style="height:' + Math.max(2, (v.v / max) * h) + 'px" title="' + esc(v.title || money(v.v)) + '"></div>').join("") +
      '</div>' +
      '<span class="bar-label">' + esc(r.label) + '</span>' +
    '</div>').join("") + '</div>';
}

/* ---------- global event wiring ---------- */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act;
  if (act === "closeModalBack" && e.target !== el) return; // only the backdrop itself
  const fn = ACTIONS[act];
  if (!fn) return;
  e.preventDefault();
  fn(el.dataset, el, e);
});
document.addEventListener("change", e => {
  const el = e.target.closest("[data-change]");
  if (!el) return;
  const fn = ACTIONS[el.dataset.change];
  if (fn) fn(el.dataset, el, e);
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && $("#overlay").innerHTML) closeModal();
  // Keep Tab inside an open dialog — outside it is unreachable anyway.
  if (e.key === "Tab" && $("#overlay").innerHTML) {
    const items = [...$("#overlay").querySelectorAll('button,input,select,textarea,[tabindex="0"]')]
      .filter(el => !el.disabled && el.offsetParent !== null);
    if (items.length) {
      const first = items[0], last = items[items.length - 1];
      const here = document.activeElement;
      if (e.shiftKey && (here === first || !$("#overlay").contains(here))) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && (here === last || !$("#overlay").contains(here))) { e.preventDefault(); first.focus(); }
    }
  }
  if (e.key === "Enter" && e.target.matches("[data-f][data-enter]")) {
    const btn = e.target.closest("[data-form]").querySelector("[data-submit]");
    if (btn) btn.click();
  }
});
window.addEventListener("hashchange", () => {
  const h = location.hash.replace("#", "");
  if (h && h !== view) go(h);
});
</script>
<script>
/* ============================================================
   Module: Dashboard
   ============================================================ */
VIEWS.dashboard = function () {
  const thisKey = todayISO().slice(0, 7);
  const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - 1);
  const prev = monthStats(iso(d).slice(0, 7));
  const cur_ = monthStats(thisKey);
  const monthOrders = db.orders.filter(o => monthKey(o.date) === thisKey && isCommitted(o));
  const avg = monthOrders.length ? cur_.bookedSales / monthOrders.length : 0;
  const prevOrders = db.orders.filter(o => monthKey(o.date) === prev.key && isCommitted(o));
  const prevAvg = prevOrders.length ? prev.bookedSales / prevOrders.length : 0;
  const owed = round2(sum(db.orders, outstandingOf));
  const goal = num(db.settings.monthlyGoal);
  const goalPct = goal > 0 ? clamp(Math.round((cur_.bookedSales / goal) * 100), 0, 999) : 0;

  const delta = (now, before, asMoney) => {
    if (!before) return { cls: "flat", text: before === 0 && now > 0 ? "First revenue this month" : "No comparison yet" };
    const diff = now - before;
    const pct = Math.round((diff / Math.abs(before)) * 100);
    const shown = asMoney ? money(Math.abs(diff)) : Math.abs(pct) + "%";
    return { cls: diff >= 0 ? "up" : "down", text: (diff >= 0 ? "+" : "\u2212") + shown + " vs last month" };
  };
  const dRev = delta(cur_.bookedSales, prev.bookedSales), dAvg = delta(avg, prevAvg, true),
    dProfit = delta(cur_.profit, prev.profit), dCash = delta(cur_.cashReceived, prev.cashReceived);

  const kpi = (label, value, sub) =>
    '<div class="card"><div class="kpi-label">' + esc(label) + '</div><div class="kpi-value num">' + esc(value) + '</div>' +
    '<div class="kpi-sub ' + sub.cls + '">' + esc(sub.text) + '</div></div>';

  const all = alerts();
  const critical = all.filter(a => a.level === "critical");
  const soon = all.filter(a => a.level === "soon");
  const today = ordersOn(todayISO());

  // Revenue by product category, this month
  const cats = {};
  for (const o of monthOrders) {
    const p = productById(o.productId);
    const key = (p && p.category) || "Other";
    cats[key] = (cats[key] || 0) + num(o.total);
  }
  const catRows = Object.entries(cats).sort((a, b) => b[1] - a[1]).slice(0, 5)
    .map(([label, v]) => ({ label, values: [{ v, title: money(v) }] }));

  return header("Dashboard", "See your bakery at a glance.") +
    '<div class="grid kpis mb">' +
      kpi("Booked sales this month", money0(cur_.bookedSales), dRev) +
      kpi("Cash received this month", money0(cur_.cashReceived), dCash) +
      kpi("Net profit this month", money0(cur_.profit), dProfit) +
      '<div class="card"><div class="kpi-label">Outstanding</div>' +
        '<div class="kpi-value num" style="color:var(--amber)">' + money0(owed) + '</div>' +
        '<div class="kpi-sub flat">Owed on booked orders</div></div>' +
      kpi("Avg order value", money0(avg), dAvg) +
    '</div>' +

    '<section class="card mb"><div class="card-title">Today&rsquo;s priority</div>' +
      (critical.length === 0 && soon.length === 0 && today.length === 0
        ? '<div class="alert green"><span class="dot"></span>Nothing critical today. Enjoy the quiet.</div>'
        : "") +
      (critical.length ? '<div class="stack" style="gap:8px;margin-bottom:14px">' +
        critical.map(a => '<div class="alert red"><span class="dot"></span><span class="strong">' + esc(a.text) + '</span></div>').join("") + '</div>' : "") +
      (today.length ? '<div style="border-top:1px solid var(--line);padding-top:14px;margin-bottom:14px">' +
        '<div class="strong" style="font-size:14px;opacity:.7;margin-bottom:8px">Today&rsquo;s orders</div>' +
        today.map(o => '<div class="row between" style="padding:6px 0;font-size:14.5px"><span>' + esc(customerName(o.customerId)) + ' — ' + esc(productName(o.productId)) +
          '</span><span class="strong num">' + money(o.total) + '</span></div>').join("") + '</div>' : "") +
      (soon.length ? '<div class="stack" style="gap:8px">' +
        soon.slice(0, 5).map(a => '<div class="alert amber"><span class="dot"></span>' + esc(a.text) + '</div>').join("") + '</div>' : "") +
    '</section>' +

    '<div class="grid wide-narrow">' +
      card("Booked sales by category (this month)",
        catRows.length ? barChart(catRows, 190) : emptyRow("No revenue logged this month yet.")) +
      '<div class="stack">' +
        '<section class="card">' +
          '<div class="row between strong" style="margin-bottom:10px"><span>Monthly goal</span><span class="num">' + goalPct + '%</span></div>' +
          '<div class="progress"><div style="width:' + Math.min(100, goalPct) + '%"></div></div>' +
          '<div class="hint" style="margin-top:8px">' + money0(cur_.bookedSales) + ' of ' + money0(goal) + ' target</div>' +
        '</section>' +
        '<section class="card"><div class="card-title">Quick actions</div><div class="stack" style="gap:8px">' +
          '<button class="btn block" data-act="go" data-view="orders">Add an enquiry</button>' +
          '<button class="btn ghost block" data-act="printBakeSheet">Print today&rsquo;s bake sheet</button>' +
          '<button class="btn neutral block" data-act="go" data-view="settings">Backup my data</button>' +
        '</div></section>' +
      '</div>' +
    '</div>';
};

/* ============================================================
   Module: Order calendar
   ============================================================ */
VIEWS.calendar = function () {
  const base = ui.month ? parseISO(ui.month + "-01") : (() => { const d = new Date(); d.setDate(1); return d; })();
  const year = base.getFullYear(), month = base.getMonth();
  const first = new Date(year, month, 1);
  const startPad = first.getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const cells = Math.ceil((startPad + daysInMonth) / 7) * 7;
  const monthOrders = db.orders.filter(o => monthKey(o.date) === iso(first).slice(0, 7));
  const revenue = round2(sum(monthOrders.filter(isCommitted), o => num(o.total)));

  let grid = "";
  for (let i = 0; i < cells; i++) {
    const dayNum = i - startPad + 1;
    if (dayNum < 1 || dayNum > daysInMonth) { grid += '<div class="cal-day out"></div>'; continue; }
    const date = iso(new Date(year, month, dayNum));
    const list = ordersOn(date);
    const classes = ["cal-day"];
    if (date === todayISO()) classes.push("today");
    if (list.length) classes.push("busy");
    grid += '<div class="' + classes.join(" ") + '"><span class="cal-num">' + dayNum + '</span>' +
      list.map(o => '<div class="cal-chip ' + o.status + '" data-act="openOrder" data-id="' + o.id + '" title="' +
        esc(customerName(o.customerId) + " — " + productName(o.productId) + " · " + money(o.total)) + '">' +
        esc(customerName(o.customerId).split(" ")[0] + " · " + productName(o.productId)) + '</div>').join("") +
      '</div>';
  }

  const upcoming = db.orders.filter(o => daysUntil(o.date) >= 0 && o.status !== "paid")
    .sort((a, b) => a.date.localeCompare(b.date)).slice(0, 6);

  return header("Order calendar", MONTHS[month] + " " + year + " · " + monthOrders.length +  " order" + (monthOrders.length === 1 ? "" : "s") + " · " + money0(revenue) + " booked") +
    '<div class="row between mb">' +
      '<div class="row">' +
        '<button class="btn neutral sm" data-act="calMove" data-by="-1">&larr; Prev</button>' +
        '<button class="btn neutral sm" data-act="calToday">Today</button>' +
        '<button class="btn neutral sm" data-act="calMove" data-by="1">Next &rarr;</button>' +
      '</div>' +
      '<div class="legend">' +
        '<span><i class="swatch" style="background:rgba(45,33,24,.55)"></i>Enquiry</span>' +
        '<span><i class="swatch" style="background:var(--amber)"></i>Quoted</span>' +
        '<span><i class="swatch"></i>Booked</span>' +
        '<span><i class="swatch" style="background:var(--green)"></i>Paid</span>' +
      '</div>' +
    '</div>' +
    '<div class="cal-head">' + ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(w => '<span>' + w + '</span>').join("") + '</div>' +
    '<div class="cal-grid mb">' + grid + '</div>' +
    '<div class="grid two">' +
      card("Coming up", upcoming.length ? upcoming.map(o =>
        '<div class="row between" style="padding:10px 0;border-bottom:1px solid var(--line)">' +
          '<span>' + esc(customerName(o.customerId)) + ' — ' + esc(productName(o.productId)) + '</span>' +
          '<span class="muted">' + fmtDate(o.date) + ' · ' + STATUS_LABEL[o.status] + '</span>' +
        '</div>').join("") : emptyRow("Nothing scheduled. Time to drum up orders.")) +
      card("Print for the kitchen",
        '<p class="hint" style="margin-top:0">A bake sheet lists every order for a day — products, quantities, allergens and notes.</p>' +
        '<div data-form="bakesheet" class="form-grid" style="grid-template-columns:1fr auto">' +
          field("Date", '<input type="date" data-f="date" value="' + todayISO() + '">') +
          '<button class="btn" data-act="printBakeSheetFor">Print bake sheet</button>' +
        '</div>') +
    '</div>';
};

<script>
/* ============================================================

VIEWS.orders = function () {
  const filter = ui.filter || "all";

    .filter(o => filter === "all" || o.status === filter)

  // Show the newest slice by default; a long history should not slow the
  // page down when search and the filters are right there.
  const LIMIT = 150;

  const hidden = matched.length - rows.length;

  const cols = STATUSES.map(s => {
    const list = db.orders.filter(o => o.status === s).sort((a, b) => a.date.localeCompare(b.date));
    return '<div class="kan-col" data-drop="' + s + '">' +
      '<div class="kan-head"><span>' + STATUS_LABEL[s] + '</span><span class="count">' + list.length + '</span></div>' +

            (quoteExpired(o) ? "Quote expired " + fmtDate(quoteExpiry(o)) : "Quote valid to " + fmtDate(quoteExpiry(o))) + '</div>' : "") +
          '<div class="bal" style="color:' + (o.status === "paid" ? "var(--green)" : bal > 0 ? "var(--amber)" : "var(--ink-60)") + '">' +
            balLabel + '</div>' +
          (s !== "paid" ? '<button class="btn ghost sm" style="margin-top:8px" data-act="advance" data-id="' + o.id + '">Move to ' + STATUS_LABEL[STATUSES[STATUSES.indexOf(s) + 1]] + '</button>' : "") +

      }).join("") + (list.length > 40 ? '<div class="hint" style="padding:6px 2px">+ ' + (list.length - 40) + ' more in the table below.</div>' : "")
        : '<div class="hint" style="padding:8px 2px">Move an order here.</div>') +
